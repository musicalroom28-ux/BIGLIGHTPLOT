<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIGLIGHT PLOT</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>

  <style>
    body { margin: 0; overflow: hidden; font-weight: 500; }
    
    /* 텍스트 드래그 및 선택 방지 (입력창 제외) */
    .no-select {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    input, textarea, select {
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }

    /* 텍스트 드래그(선택) 시 기본 검정 배경에 흰 글씨 적용 */
    ::-moz-selection { background: #000; color: #fff; }
    ::selection { background: #000; color: #fff; }

    /* 인쇄 시 화면 백지화 (PDF 불법 복제 방지) */
    @media print {
      body { display: none !important; }
    }
    
    /* 스크롤바 디자인 */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
    .custom-scrollbar:hover::-webkit-scrollbar-thumb { background: #64748b; }
    
    /* 툴팁 */
    .tooltip-trigger:hover::after {
      content: attr(title);
      position: absolute;
      bottom: -30px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #1e293b;
      color: #cbd5e1;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      z-index: 100;
      border: 1px solid #334155;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0",
        "three": "https://esm.sh/three@0.160.0",
        "three/examples/jsm/controls/OrbitControls.js": "https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js"
      }
    }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- 안정적인 PDF.js 버전 사용 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body class="no-select">
  
  <!-- [보안] 스크립트 -->
  <script>
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (
        e.key === 'F12' || 
        (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) ||
        (e.ctrlKey && e.key.toUpperCase() === 'U') ||
        (e.ctrlKey && e.key.toUpperCase() === 'S') ||
        (e.ctrlKey && e.key.toUpperCase() === 'P')
      ) {
        e.preventDefault();
      }
    });
    (function() {
      const block = function() { try { debugger; } catch (e) {} };
      setInterval(block, 1000);
    })();
  </script>

  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useRef, useCallback, useEffect, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import {
      Move, ZoomIn, ZoomOut, Settings2, Plus,
      Trash2, MousePointer2, GripHorizontal,
      Lightbulb, CheckSquare, Target, PaintBucket, LayoutTemplate,
      Layers, Eye, EyeOff, Lock, Unlock, Edit2, Hand,
      Save, Upload, Printer, Sun, Moon, Maximize2, Copy, ClipboardPaste, Files, Shapes,
      Sparkles, Loader2, X, FileText, Image as ImageIcon, Link, Unlink, Undo, Redo, Square, Droplet,
      Box, RotateCcw, ClipboardList
    } from 'lucide-react';

    // --- AI API Helper ---
    const callGemini = async (prompt, systemInstruction, isJson = false) => {
      const apiKey = ""; 
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
      const payload = {
        contents: [{ parts: [{ text: prompt }] }],
        systemInstruction: { parts: [{ text: systemInstruction }] }
      };
      if (isJson) payload.generationConfig = { responseMimeType: "application/json" };

      let delay = 1000;
      for (let i = 0; i < 6; i++) {
        try {
          const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          if (!res.ok) throw new Error(`API Error: ${res.status}`);
          const data = await res.json();
          return data.candidates[0].content.parts[0].text;
        } catch (error) {
          if (i === 5) throw error;
          await new Promise(r => setTimeout(r, delay));
          delay *= 2;
        }
      }
    };

    // --- 심볼 정의 ---
    const FIXTURE_TYPES = {
      STAGE_PROSCENIUM: {
        id: 'STAGE_PROSCENIUM', category: 'venue', name: '프로시니엄 (Proscenium)',
        render: (color = '#fff', width = 500, rotation = 0, thickness = 2, height = 400, text = '', src = '', bg = '', op = 1, dash = '', rx = 0) => (
          <svg width={width} height={height} viewBox={`${-width/2} ${-height/2} ${width} ${height}`} style={{ overflow: 'visible', opacity: op }}>
            <rect x={-width/2} y={-height/2} width={width} height={height*0.7} fill={bg || "#1e293b"} stroke={color !== '#fff' ? color : '#64748b'} strokeWidth={thickness} strokeDasharray={dash || undefined} rx={rx} />
            <path d={`M ${-width/2} ${-height/2 + height*0.7} Q 0 ${height/2} ${width/2} ${-height/2 + height*0.7} Z`} fill={bg || "#1e293b"} stroke={color !== '#fff' ? color : '#64748b'} strokeWidth={thickness} strokeDasharray={dash || undefined} strokeLinejoin="round" />
            <line x1={-width/2} y1={-height/2 + height*0.7} x2={width/2} y2={-height/2 + height*0.7} stroke={color !== '#fff' ? color : '#64748b'} strokeWidth="2" strokeDasharray="5 5" />
          </svg>
        )
      },
      STAGE_THRUST: {
        id: 'STAGE_THRUST', category: 'venue', name: '돌출 무대 (Thrust)',
        render: (color = '#fff', width = 500, rotation = 0, thickness = 2, height = 400, text = '', src = '', bg = '', op = 1, dash = '', rx = 0) => (
          <svg width={width} height={height} viewBox={`${-width/2} ${-height/2} ${width} ${height}`} style={{ overflow: 'visible', opacity: op }}>
            <rect x={-width/2} y={-height/2} width={width} height={height*0.4} fill={bg || "#1e293b"} stroke={color !== '#fff' ? color : '#64748b'} strokeWidth={thickness} strokeDasharray={dash || undefined} rx={rx} />
            <path d={`M ${-width*0.3} ${-height/2 + height*0.4} L ${width*0.3} ${-height/2 + height*0.4} L ${width*0.3} ${height/2} L ${-width*0.3} ${height/2} Z`} fill={bg || "#1e293b"} stroke={color !== '#fff' ? color : '#64748b'} strokeWidth={thickness} strokeDasharray={dash || undefined} strokeLinejoin="round" />
          </svg>
        )
      },
      STAGE_ARENA: {
        id: 'STAGE_ARENA', category: 'venue', name: '아레나 (Arena)',
        render: (color = '#fff', width = 400, rotation = 0, thickness = 2, height = 400, text = '', src = '', bg = '', op = 1, dash = '', rx = 0) => (
          <svg width={width} height={height} viewBox={`${-width/2} ${-height/2} ${width} ${height}`} style={{ overflow: 'visible', opacity: op }}>
            <ellipse cx="0" cy="0" rx={width/2} ry={height/2} fill={bg || "#1e293b"} stroke={color !== '#fff' ? color : '#64748b'} strokeWidth={thickness} strokeDasharray={dash || undefined} />
            <ellipse cx="0" cy="0" rx={width/2 - 10} ry={height/2 - 10} fill="none" stroke={color !== '#fff' ? color : '#64748b'} strokeWidth="1" strokeDasharray="4 4" />
          </svg>
        )
      },
      STAGE_BLACKBOX: {
        id: 'STAGE_BLACKBOX', category: 'venue', name: '블랙박스 (Black Box)',
        render: (color = '#fff', width = 500, rotation = 0, thickness = 2, height = 500, text = '', src = '', bg = '', op = 1, dash = '', rx = 0) => (
          <svg width={width} height={height} viewBox={`${-width/2} ${-height/2} ${width} ${height}`} style={{ overflow: 'visible', opacity: op }}>
            <rect x={-width/2} y={-height/2} width={width} height={height} fill={bg || "#1e293b"} stroke={color !== '#fff' ? color : '#64748b'} strokeWidth={thickness} strokeDasharray={dash || undefined} rx={rx} />
            <rect x={-width/2 + 10} y={-height/2 + 10} width={width - 20} height={height - 20} fill="none" stroke={color !== '#fff' ? color : '#64748b'} strokeWidth="1" strokeDasharray="4 4" rx={Math.max(0, rx - 10)} />
          </svg>
        )
      },
      IMAGE: {
        id: 'IMAGE', category: 'image', name: '이미지 (Image)',
        render: (color = '#fff', width = 200, rotation = 0, thickness = 2, height = 200, text = '', src = '', bg = '', op = 1, dash = '', rx = 0) => (
          <svg width={width} height={height} viewBox={`${-width/2} ${-height/2} ${width} ${height}`} style={{ overflow: 'visible', opacity: op }}>
            {bg && <rect x={-width/2} y={-height/2} width={width} height={height} fill={bg} rx={rx} />}
            {src ? (
              <image href={src} x={-width/2} y={-height/2} width={width} height={height} preserveAspectRatio="none" />
            ) : (
              <rect x={-width/2} y={-height/2} width={width} height={height} fill={bg || "#cbd5e1"} stroke={color} strokeWidth={thickness} strokeDasharray={dash || undefined} rx={rx} />
            )}
          </svg>
        )
      },
      TEXT: {
        id: 'TEXT', category: 'memo', name: '자유 텍스트 (Text)',
        render: (color = '#fff', width = 200, rotation = 0, thickness = 2, height = 50, text = '텍스트 메모', src = '', bg = '', op = 1, dash = '', rx = 0) => {
          const lines = text.split('\n');
          const boxW = Math.max(200, width);
          const boxH = Math.max(50, lines.length * 30 + 20);
          return (
            <svg width={boxW} height={boxH} viewBox={`${-boxW/2} ${-boxH/2} ${boxW} ${boxH}`} style={{ overflow: 'visible', opacity: op }}>
              {(bg || dash) && <rect x={-boxW/2} y={-boxH/2} width={boxW} height={boxH} fill={bg || "transparent"} stroke={dash ? color : "none"} strokeWidth={thickness} strokeDasharray={dash || undefined} rx={rx || 4} />}
              {lines.map((line, i) => (
                <text key={i} x="0" y={(i - (lines.length - 1) / 2) * 32} fill={color} fontSize="32" fontFamily="sans-serif" textAnchor="middle" dominantBaseline="central" fontWeight="bold">{line}</text>
              ))}
            </svg>
          );
        }
      },
      LABEL: {
        id: 'LABEL', category: 'memo', name: '라벨 박스 (Label Box)',
        render: (color = '#fff', width = 150, rotation = 0, thickness = 2, height = 40, text = '라벨 메모', src = '', bg = '', op = 1, dash = '', rx = 0) => {
          const lines = text.split('\n');
          const boxHeight = Math.max(height, lines.length * 20 + 20);
          return (
            <svg width={width} height={boxHeight} viewBox={`${-width/2} ${-boxHeight/2} ${width} ${boxHeight}`} style={{ overflow: 'visible', opacity: op }}>
              <rect x={-width/2} y={-boxHeight/2} width={width} height={boxHeight} fill={bg || color} fillOpacity={bg ? 1 : 0.15} stroke={color} strokeWidth={thickness} strokeDasharray={dash || undefined} rx={rx !== undefined ? rx : 4} />
              {lines.map((line, i) => (
                <text key={i} x="0" y={(i - (lines.length - 1) / 2) * 20} fill={bg ? color : (color === '#ffffff' ? '#000' : color)} fontSize="16" fontFamily="sans-serif" textAnchor="middle" dominantBaseline="central" fontWeight="bold">{line}</text>
              ))}
            </svg>
          );
        }
      },
      LINE: {
        id: 'LINE', category: 'shape', name: '선 (Line)',
        render: (color = '#fff', width = 100, rotation = 0, thickness = 2, height = 20, text = '', src = '', bg = '', op = 1, dash = '', rx = 0) => (
          <svg width={width} height="20" viewBox={`0 -10 ${width} 20`} style={{ overflow: 'visible', opacity: op }}>
            <line x1="0" y1="0" x2={width} y2="0" stroke={color} strokeWidth={thickness} strokeLinecap="round" strokeDasharray={dash || undefined} />
          </svg>
        )
      },
      RECTANGLE: {
        id: 'RECTANGLE', category: 'shape', name: '사각형 (Rectangle)',
        render: (color = '#fff', width = 100, rotation = 0, thickness = 2, height = 100, text = '', src = '', bg = '', op = 1, dash = '', rx = 0) => (
          <svg width={width} height={height} viewBox={`${-width/2} ${-height/2} ${width} ${height}`} style={{ overflow: 'visible', opacity: op }}>
            <rect x={-width/2} y={-height/2} width={width} height={height} fill={bg || "none"} stroke={color} strokeWidth={thickness} strokeDasharray={dash || undefined} rx={rx} />
          </svg>
        )
      },
      CIRCLE: {
        id: 'CIRCLE', category: 'shape', name: '원/타원 (Circle)',
        render: (color = '#fff', width = 100, rotation = 0, thickness = 2, height = 100, text = '', src = '', bg = '', op = 1, dash = '', rx = 0) => (
          <svg width={width} height={height} viewBox={`${-width/2} ${-height/2} ${width} ${height}`} style={{ overflow: 'visible', opacity: op }}>
            <ellipse cx="0" cy="0" rx={width/2} ry={height/2} fill={bg || "none"} stroke={color} strokeWidth={thickness} strokeDasharray={dash || undefined} />
          </svg>
        )
      },
      CURVE: {
        id: 'CURVE', category: 'shape', name: '곡선 (Curve)',
        render: (color = '#fff', width = 100, rotation = 0, thickness = 2, height = 100, text = '', src = '', bg = '', op = 1, dash = '', rx = 0) => (
          <svg width={width} height={height} viewBox={`${-width/2} ${-height/2} ${width} ${height}`} style={{ overflow: 'visible', opacity: op }}>
            <path d={`M ${-width/2} ${height/2} Q 0 ${-height/2} ${width/2} ${height/2}`} fill={bg || "none"} stroke={color} strokeWidth={thickness} strokeLinecap="round" strokeDasharray={dash || undefined} />
          </svg>
        )
      },
      BATTEN: {
        id: 'BATTEN', category: 'structure', name: '세트 바텐 (Set Batten)',
        render: (color = '#fff', width = 300, r=0, t=2, h=20, txt='', src='', bg='', op=1, dash='', rx=0) => (
          <svg width={width} height="20" viewBox={`${-width / 2} -10 ${width} 20`} style={{ overflow: 'visible', opacity: op }}>
            <rect x={-width / 2} y="-3" width={width} height="6" fill={bg || "none"} stroke={color} strokeWidth={t} strokeDasharray={dash || undefined} rx={rx} />
          </svg>
        )
      },
      TRUSS: {
        id: 'TRUSS', category: 'structure', name: '사각 트러스 (0.6m)',
        render: (color = '#fff', width = 300, r=0, t=2, h=30, txt='', src='', bg='', op=1, dash='', rx=0) => {
          const segs = Math.max(1, Math.round(width / 30));
          const segW = width / segs;
          let p1 = `M ${-width / 2} -15`; let p2 = `M ${-width / 2} 15`;
          for (let i = 1; i <= segs; i++) {
            const x = -width / 2 + i * segW;
            p1 += ` L ${x} ${i % 2 === 1 ? 15 : -15}`;
            p2 += ` L ${x} ${i % 2 === 1 ? -15 : 15}`;
          }
          return (
            <svg width={width} height="30" viewBox={`${-width / 2} -15 ${width} 30`} style={{ overflow: 'visible', opacity: op }}>
              <rect x={-width / 2} y="-15" width={width} height="30" fill={bg || "none"} stroke={color} strokeWidth={t} strokeDasharray={dash || undefined} rx={rx} />
              <path d={p1} fill="none" stroke={color} strokeWidth={Math.max(1, t/2)} />
              <path d={p2} fill="none" stroke={color} strokeWidth={Math.max(1, t/2)} />
            </svg>
          );
        }
      },
      TRUSS_300: {
        id: 'TRUSS_300', category: 'structure', name: '슬림 트러스 (0.3m)',
        render: (color = '#fff', width = 300, r=0, t=2, h=15, txt='', src='', bg='', op=1, dash='', rx=0) => {
          const segs = Math.max(1, Math.round(width / 20));
          const segW = width / segs;
          let p1 = `M ${-width / 2} -7.5`; let p2 = `M ${-width / 2} 7.5`;
          for (let i = 1; i <= segs; i++) {
            const x = -width / 2 + i * segW;
            p1 += ` L ${x} ${i % 2 === 1 ? 7.5 : -7.5}`;
            p2 += ` L ${x} ${i % 2 === 1 ? -7.5 : 7.5}`;
          }
          return (
            <svg width={width} height="15" viewBox={`${-width / 2} -7.5 ${width} 15`} style={{ overflow: 'visible', opacity: op }}>
              <rect x={-width / 2} y="-7.5" width={width} height="15" fill={bg || "none"} stroke={color} strokeWidth={t} strokeDasharray={dash || undefined} rx={rx} />
              <path d={p1} fill="none" stroke={color} strokeWidth={Math.max(0.8, t/2)} />
              <path d={p2} fill="none" stroke={color} strokeWidth={Math.max(0.8, t/2)} />
            </svg>
          );
        }
      },
      RULER_H: {
        id: 'RULER_H', category: 'structure', name: '가로자 (Ruler H, m)',
        render: (color = '#fff', width = 500, r = 0, t = 2, h = 24, txt = '', src = '', bg = '', op = 1, dash = '', rx = 0) => {
          const step = 50; // 50px = 1m
          const count = Math.max(1, Math.round(width / step));
          return (
            <svg width={width} height={h + 16} viewBox={`${-width / 2} ${-h / 2 - 2} ${width} ${h + 16}`} style={{ overflow: 'visible', opacity: op }}>
              <line x1={-width / 2} y1="0" x2={width / 2} y2="0" stroke={color} strokeWidth={t} strokeDasharray={dash || undefined} strokeLinecap="round" />
              {Array.from({ length: count + 1 }).map((_, i) => {
                const x = -width / 2 + i * step;
                const major = i % 5 === 0;
                return (
                  <g key={i}>
                    <line x1={x} y1={-(major ? h / 2 : h / 4)} x2={x} y2={major ? h / 2 : h / 4} stroke={color} strokeWidth={Math.max(1, t / 2)} />
                  </g>
                );
              })}
            </svg>
          );
        }
      },
      RULER_V: {
        id: 'RULER_V', category: 'structure', name: '세로자 (Ruler V, m)',
        render: (color = '#fff', width = 500, r = 0, t = 2, h = 24, txt = '', src = '', bg = '', op = 1, dash = '', rx = 0) => {
          const step = 50; // 50px = 1m
          const count = Math.max(1, Math.round(width / step));
          return (
            <svg width={h + 16} height={width} viewBox={`${-h / 2 - 2} ${-width / 2} ${h + 16} ${width}`} style={{ overflow: 'visible', opacity: op }}>
              <line x1="0" y1={-width / 2} x2="0" y2={width / 2} stroke={color} strokeWidth={t} strokeDasharray={dash || undefined} strokeLinecap="round" />
              {Array.from({ length: count + 1 }).map((_, i) => {
                const y = -width / 2 + i * step;
                const major = i % 5 === 0;
                return (
                  <g key={i}>
                    <line x1={-(major ? h / 2 : h / 4)} y1={y} x2={major ? h / 2 : h / 4} y2={y} stroke={color} strokeWidth={Math.max(1, t / 2)} />
                  </g>
                );
              })}
            </svg>
          );
        }
      },
      ERS: { id: 'ERS', category: 'fixture', name: 'ERS (소스포)', render: (color, w, r, t=2, h, txt, src, bg, op=1, dash='', rx=0) => (
        <svg width="40" height="40" viewBox="-20 -20 40 40" style={{ overflow: 'visible', opacity: op }}><path d="M -15 -8 L 5 -8 L 5 -12 L 15 -12 L 15 12 L 5 12 L 5 8 L -15 8 Z" fill={bg || "none"} stroke={color} strokeWidth={t} strokeDasharray={dash || undefined} strokeLinejoin="round" /><line x1="-5" y1="-8" x2="-5" y2="8" stroke={color} strokeWidth={t} /><line x1="-15" y1="0" x2="20" y2="0" stroke={color} strokeWidth={1} strokeDasharray="2 2" /></svg>
      )},
      FRESNEL: { id: 'FRESNEL', category: 'fixture', name: '프레넬', render: (color, w, r, t=2, h, txt, src, bg, op=1, dash='', rx=0) => (
        <svg width="40" height="40" viewBox="-20 -20 40 40" style={{ opacity: op }}><rect x="-12" y="-12" width="24" height="24" fill={bg || "none"} stroke={color} strokeWidth={t} strokeDasharray={dash || undefined} rx={rx} /><path d="M -12 8 L 12 8 M -8 12 L 8 12" fill="none" stroke={color} strokeWidth={t} /><line x1="-20" y1="0" x2="20" y2="0" stroke={color} strokeWidth={1} strokeDasharray="2 2" /></svg>
      )},
      PAR: { id: 'PAR', category: 'fixture', name: '파캔', render: (color, w, r, t=2, h, txt, src, bg, op=1, dash='', rx=0) => (
        <svg width="40" height="40" viewBox="-20 -20 40 40" style={{ opacity: op }}><ellipse cx="0" cy="-2" rx="10" ry="14" fill={bg || "none"} stroke={color} strokeWidth={t} strokeDasharray={dash || undefined} /><path d="M -10 -2 L -10 12 L 10 12 L 10 -2" fill="none" stroke={color} strokeWidth={t} /><line x1="-15" y1="0" x2="15" y2="0" stroke={color} strokeWidth={1} strokeDasharray="2 2" /></svg>
      )},
      CYC: { id: 'CYC', category: 'fixture', name: '사이클로라마', render: (color, w, r, t=2, h, txt, src, bg, op=1, dash='', rx=0) => (
        <svg width="40" height="40" viewBox="-20 -20 40 40" style={{ opacity: op }}><rect x="-15" y="-10" width="30" height="20" fill={bg || "none"} stroke={color} strokeWidth={t} strokeDasharray={dash || undefined} rx={rx} /><path d="M -15 -10 L -15 -15 L 15 -15 L 15 -10" fill="none" stroke={color} strokeWidth={t} /></svg>
      )},
      STRIPLIGHT: { id: 'STRIPLIGHT', category: 'fixture', name: '스트립 라이트', render: (color, w, r, t=2, h, txt, src, bg, op=1, dash='', rx=0) => (

    };

    // --- 3D 미리보기 ---
    const PLOT_SCALE = 1 / 50; // 평면도 50px = 1m
    const RIG_HEIGHT = 5; // 트러스/바텐/조명기구 기본 설치 높이(m)

    // --- 새 문서(도면 바탕) ---
    const PAPER_SIZES_MM = { A4: { w: 210, h: 297 }, A3: { w: 297, h: 420 } };
    const PAPER_UNITS_PER_MM = 2.5; // 1:50 축척 기준 (50 unit = 1m 규칙과 동일)
    const computePageSize = (setting) => {
      let wMM, hMM, label;
      if (setting.useCustom) {
        wMM = Math.max(10, Number(setting.customW) || 210);
        hMM = Math.max(10, Number(setting.customH) || 297);
        label = `커스텀 (${wMM}×${hMM}mm)`;
      } else {
        const base = PAPER_SIZES_MM[setting.preset] || PAPER_SIZES_MM.A4;
        const isLandscape = setting.orientation === 'landscape';
        wMM = isLandscape ? Math.max(base.w, base.h) : Math.min(base.w, base.h);
        hMM = isLandscape ? Math.min(base.w, base.h) : Math.max(base.w, base.h);
        label = `${setting.preset} ${isLandscape ? '가로' : '세로'} (${wMM}×${hMM}mm)`;
      }
      return { widthMM: wMM, heightMM: hMM, widthUnits: wMM * PAPER_UNITS_PER_MM, heightUnits: hMM * PAPER_UNITS_PER_MM, label };
    };

    const toThreeColor = (c, fallback) => (c && /^#([0-9A-Fa-f]{3}){1,2}$/.test(c)) ? c : fallback;

    const add3DFixture = (THREE, parentGroup, f, showBeams, selected) => {
      const tInfo = FIXTURE_TYPES[f.type];
      if (!tInfo) return;
      const x = f.x * PLOT_SCALE, z = f.y * PLOT_SCALE;
      const rot = (f.rotation || 0) * Math.PI / 180;
      const sc = f.scale || 1;
      const lineColor = selected ? '#818cf8' : toThreeColor(f.color, tInfo.category === 'fixture' ? '#cbd5e1' : '#94a3b8');
      const fillColor = toThreeColor(f.bgColor, null);
      const opacity = f.opacity != null ? f.opacity : 1;
      const emissive = selected ? { emissive: 0x818cf8, emissiveIntensity: 0.5 } : {};

      const fixtureGroup = new THREE.Group();
      fixtureGroup.userData.fixtureId = f.id;
      parentGroup.add(fixtureGroup);

      if (tInfo.category === 'venue') {
        const w = (f.width || 500) * PLOT_SCALE, d = (f.height || 400) * PLOT_SCALE;
        const geo = f.type === 'STAGE_ARENA' ? new THREE.CylinderGeometry(w / 2, w / 2, 0.3, 48) : new THREE.BoxGeometry(w, 0.3, d);
        const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: fillColor || '#1e293b', roughness: 0.85, ...emissive }));
        mesh.position.set(x, 0.15, z); mesh.rotation.y = rot; mesh.receiveShadow = true;
        fixtureGroup.add(mesh);
        const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: lineColor }));
        edges.position.copy(mesh.position); edges.rotation.copy(mesh.rotation);
        fixtureGroup.add(edges);
      } else if (tInfo.category === 'structure') {
        const rigH = f.zHeight != null ? f.zHeight : RIG_HEIGHT;
        const len = (f.width || 300) * PLOT_SCALE;
        const isBatten = f.type === 'BATTEN';
        const geo = isBatten ? new THREE.CylinderGeometry(0.04, 0.04, len, 8).rotateZ(Math.PI / 2) : new THREE.BoxGeometry(len, 0.25, 0.25);
        const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: lineColor, metalness: 0.6, roughness: 0.4, ...emissive }));
        mesh.position.set(x, rigH, z); mesh.rotation.y = rot; mesh.castShadow = true;
        fixtureGroup.add(mesh);
      } else if (tInfo.category === 'fixture') {
        const h = (f.zHeight != null ? f.zHeight : RIG_HEIGHT) - 0.15;
        const bodyMat = new THREE.MeshStandardMaterial({ color: lineColor, metalness: 0.3, roughness: 0.5, ...emissive });
        const isMoving = f.type.startsWith('MOVING_') || f.type === 'SCANNER' || f.type === 'FOLLOWSPOT';
        const body = isMoving
          ? new THREE.Mesh(new THREE.SphereGeometry(0.12 * sc, 12, 12), bodyMat)
          : new THREE.Mesh(new THREE.ConeGeometry(0.1 * sc, 0.22 * sc, 16).rotateX(Math.PI), bodyMat);
        body.position.set(x, h, z); body.rotation.y = rot; body.castShadow = true;
        fixtureGroup.add(body);

        if (showBeams) {
          const beamH = Math.max(0.2, h - 0.05);
          const beam = new THREE.Mesh(
            new THREE.ConeGeometry(0.9 * sc, beamH, 24, 1, true),
            new THREE.MeshBasicMaterial({ color: lineColor, transparent: true, opacity: 0.12, side: THREE.DoubleSide, depthWrite: false })
          );
          beam.position.set(x, beamH / 2, z);
          fixtureGroup.add(beam);
        }
      } else if (tInfo.category === 'shape') {
        const w = (f.width || 100) * PLOT_SCALE, d = (f.height || 100) * PLOT_SCALE;
        if (f.type === 'CIRCLE') {
          const mesh = new THREE.Mesh(new THREE.RingGeometry(Math.max(0.01, w / 2 - 0.03), w / 2, 32), new THREE.MeshBasicMaterial({ color: lineColor, side: THREE.DoubleSide }));
          mesh.rotation.x = -Math.PI / 2; mesh.rotation.z = rot; mesh.position.set(x, 0.02, z);
          fixtureGroup.add(mesh);
        } else if (f.type === 'LINE' || f.type === 'CURVE') {
          const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, 0.05), new THREE.MeshBasicMaterial({ color: lineColor, side: THREE.DoubleSide }));
          mesh.rotation.x = -Math.PI / 2; mesh.rotation.z = rot; mesh.position.set(x, 0.02, z);
          fixtureGroup.add(mesh);
        } else {
          const fillMesh = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({ color: fillColor || lineColor, transparent: true, opacity: fillColor ? Math.max(0.4, opacity) : 0.12, side: THREE.DoubleSide }));
          fillMesh.rotation.x = -Math.PI / 2; fillMesh.rotation.z = rot; fillMesh.position.set(x, 0.018, z);
          fixtureGroup.add(fillMesh);
          const edges = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(w, d)), new THREE.LineBasicMaterial({ color: lineColor }));
          edges.rotation.x = -Math.PI / 2; edges.rotation.z = rot; edges.position.set(x, 0.02, z);
          fixtureGroup.add(edges);
        }
      } else if (tInfo.category === 'image') {
        if (f.src) {
          const w = (f.width || 200) * PLOT_SCALE, d = (f.height || 200) * PLOT_SCALE;
          const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity, side: THREE.DoubleSide });
          const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
          mesh.rotation.x = -Math.PI / 2; mesh.rotation.z = rot; mesh.position.set(x, 0.01, z);
          fixtureGroup.add(mesh);
          new THREE.TextureLoader().load(f.src, (tex) => { mat.map = tex; mat.needsUpdate = true; });
        }
      } else if (tInfo.category === 'memo') {
        const text = (f.text || f.name || '').split('\n')[0];
        if (text) {
          const canvas = document.createElement('canvas');
          canvas.width = 256; canvas.height = 64;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = fillColor || 'rgba(15,23,42,0.7)';
          ctx.fillRect(0, 0, 256, 64);
          ctx.fillStyle = lineColor;
          ctx.font = 'bold 28px sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(text.slice(0, 16), 128, 32);
          const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true }));
          sprite.scale.set(2, 0.5, 1);
          sprite.position.set(x, 1.6, z);
          fixtureGroup.add(sprite);
        }
      }

      if (selected && (tInfo.category === 'fixture' || tInfo.category === 'structure')) {
        const r = 0.35 * sc + 0.15;
        const marker = new THREE.Mesh(
          new THREE.RingGeometry(r * 0.8, r, 32),
          new THREE.MeshBasicMaterial({ color: 0x818cf8, transparent: true, opacity: 0.7, side: THREE.DoubleSide, depthWrite: false })
        );
        marker.rotation.x = -Math.PI / 2;
        marker.position.set(x, 0.04, z);
        fixtureGroup.add(marker);
      }
    };

    function ThreeDView({ fixtures, layers, isDarkMode, showBeams, selectedIds, placingFixture, onPlaceAt, onSelectFixture, onDeselect }) {
      const mountRef = useRef(null);
      const dataRef = useRef({ fixtures, layers, showBeams, selectedIds, placingFixture });
      dataRef.current = { fixtures, layers, showBeams, selectedIds, placingFixture };
      const callbackRef = useRef({ onPlaceAt, onSelectFixture, onDeselect });
      callbackRef.current = { onPlaceAt, onSelectFixture, onDeselect };
      const rebuildRef = useRef(null);
      const sceneRefs = useRef({});

      useEffect(() => {
        const mount = mountRef.current;
        if (!mount) return;
        let disposed = false;
        let renderer, scene, camera, controls, frameId, resizeObserver;
        let onPointerDown, onPointerUp, onPointerMove;

        (async () => {
          const THREE = await import('three');
          const { OrbitControls } = await import('three/examples/jsm/controls/OrbitControls.js');
          if (disposed || !mount) return;

          const w = mount.clientWidth || 800, h = mount.clientHeight || 600;
          scene = new THREE.Scene();
          scene.background = new THREE.Color(isDarkMode ? 0x0f172a : 0xe2e8f0);
          scene.fog = new THREE.Fog(scene.background.getHex(), 30, 90);

          camera = new THREE.PerspectiveCamera(50, w / h, 0.1, 500);
          camera.position.set(10, 9, 14);

          renderer = new THREE.WebGLRenderer({ antialias: true });
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          renderer.setSize(w, h);
          renderer.shadowMap.enabled = true;
          mount.appendChild(renderer.domElement);

          controls = new OrbitControls(camera, renderer.domElement);
          controls.enableDamping = true; controls.dampingFactor = 0.08;
          controls.target.set(0, 1.5, 0);
          controls.maxPolarAngle = Math.PI * 0.49;
          controls.minDistance = 2; controls.maxDistance = 80;
          controls.update();

          scene.add(new THREE.AmbientLight(0xffffff, isDarkMode ? 0.35 : 0.6));
          scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 0.4));
          const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
          dirLight.position.set(15, 25, 10);
          dirLight.castShadow = true;
          dirLight.shadow.mapSize.set(1024, 1024);
          scene.add(dirLight);

          const floorMat = new THREE.MeshStandardMaterial({ color: isDarkMode ? 0x1e293b : 0xf8fafc, roughness: 0.9 });
          const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), floorMat);
          floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
          scene.add(floor);

          const grid = new THREE.GridHelper(60, 60, isDarkMode ? 0x334155 : 0xcbd5e1, isDarkMode ? 0x1e293b : 0xe2e8f0);
          grid.position.y = 0.001;
          scene.add(grid);

          const contentGroup = new THREE.Group();
          scene.add(contentGroup);

          const hoverMarker = new THREE.Mesh(
            new THREE.RingGeometry(0.35, 0.48, 28),
            new THREE.MeshBasicMaterial({ color: 0xa5b4fc, transparent: true, opacity: 0.8, side: THREE.DoubleSide, depthWrite: false })
          );
          hoverMarker.rotation.x = -Math.PI / 2;
          hoverMarker.visible = false;
          scene.add(hoverMarker);

          const disposeObj = (obj) => obj.traverse(o => {
            if (o.geometry) o.geometry.dispose();
            if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
          });

          const buildContent = () => {
            const { fixtures: fx, layers: ly, showBeams: beams, selectedIds: sel } = dataRef.current;
            while (contentGroup.children.length) {
              const obj = contentGroup.children[0];
              contentGroup.remove(obj);
              disposeObj(obj);
            }
            fx.filter(f => ly.find(l => l.id === (f.layerId || 'layer_default'))?.visible !== false)
              .forEach(f => add3DFixture(THREE, contentGroup, f, beams, sel.includes(f.id)));
          };

          rebuildRef.current = buildContent;
          sceneRefs.current = { floorMat, grid, scene };
          buildContent();

          resizeObserver = new ResizeObserver(() => {
            if (!mount) return;
            const nw = mount.clientWidth, nh = mount.clientHeight;
            if (!nw || !nh) return;
            camera.aspect = nw / nh; camera.updateProjectionMatrix();
            renderer.setSize(nw, nh);
          });
          resizeObserver.observe(mount);

          const raycaster = new THREE.Raycaster();
          const mouseNDC = new THREE.Vector2();
          const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
          const setNDC = (clientX, clientY) => {
            const rect = renderer.domElement.getBoundingClientRect();
            mouseNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            mouseNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
          };
          const findFixtureId = (obj) => {
            let o = obj;
            while (o) { if (o.userData && o.userData.fixtureId) return o.userData.fixtureId; o = o.parent; }
            return null;
          };

          let downX = 0, downY = 0, downButton = -1;
          onPointerDown = (e) => { downX = e.clientX; downY = e.clientY; downButton = e.button; };
          onPointerUp = (e) => {
            if (downButton !== 0 || e.button !== 0) return;
            if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;
            setNDC(e.clientX, e.clientY);
            raycaster.setFromCamera(mouseNDC, camera);
            const { placingFixture: pf } = dataRef.current;
            if (pf) {
              const hit = new THREE.Vector3();
              if (raycaster.ray.intersectPlane(groundPlane, hit)) {
                callbackRef.current.onPlaceAt(hit.x / PLOT_SCALE, hit.z / PLOT_SCALE);
              }
              return;
            }
            const intersects = raycaster.intersectObjects(contentGroup.children, true);
            let hitId = null;
            for (const it of intersects) {
              const id = findFixtureId(it.object);
              if (id) { hitId = id; break; }
            }
            if (hitId) callbackRef.current.onSelectFixture(hitId, e.shiftKey);
            else callbackRef.current.onDeselect(e.shiftKey);
          };
          onPointerMove = (e) => {
            const { placingFixture: pf } = dataRef.current;
            mount.style.cursor = pf ? 'crosshair' : 'default';
            if (!pf) { hoverMarker.visible = false; return; }
            setNDC(e.clientX, e.clientY);
            raycaster.setFromCamera(mouseNDC, camera);
            const hit = new THREE.Vector3();
            if (raycaster.ray.intersectPlane(groundPlane, hit)) {
              hoverMarker.visible = true;
              hoverMarker.position.set(hit.x, 0.03, hit.z);
            } else hoverMarker.visible = false;
          };
          renderer.domElement.addEventListener('pointerdown', onPointerDown);
          renderer.domElement.addEventListener('pointerup', onPointerUp);
          renderer.domElement.addEventListener('pointermove', onPointerMove);

          const animate = () => {
            frameId = requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
          };
          animate();
        })();

        return () => {
          disposed = true;
          rebuildRef.current = null;
          if (resizeObserver) resizeObserver.disconnect();
          if (frameId) cancelAnimationFrame(frameId);
          if (controls) controls.dispose();
          if (renderer) {
            if (onPointerDown) renderer.domElement.removeEventListener('pointerdown', onPointerDown);
            if (onPointerUp) renderer.domElement.removeEventListener('pointerup', onPointerUp);
            if (onPointerMove) renderer.domElement.removeEventListener('pointermove', onPointerMove);
            renderer.dispose();
            if (renderer.domElement && renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
          }
        };
      }, []);

      useEffect(() => { if (rebuildRef.current) rebuildRef.current(); }, [fixtures, layers, showBeams, selectedIds]);

      useEffect(() => {
        const refs = sceneRefs.current;
        if (refs.floorMat) refs.floorMat.color.set(isDarkMode ? 0x1e293b : 0xf8fafc);
        if (refs.scene && refs.scene.background) refs.scene.background.set(isDarkMode ? 0x0f172a : 0xe2e8f0);
      }, [isDarkMode]);

      return <div ref={mountRef} className="absolute inset-0" />;
    }

    export default function App() {
      const [fixtures, setFixtures] = useState([]);
      const [selectedIds, setSelectedIds] = useState([]);
      const [activeTool, setActiveTool] = useState('select'); 
      const [selectionBox, setSelectionBox] = useState(null);
      const [contextMenu, setContextMenu] = useState(null);

      const [layers, setLayers] = useState([
        { id: 'layer_structure', name: '구조물 레이어', visible: true, locked: false },

        { id: 'layer_default', name: '기본 레이어', visible: true, locked: false }
      ]);
      const [activeLayerId, setActiveLayerId] = useState('layer_fixture');
      const [editingLayerId, setEditingLayerId] = useState(null);
      const [editLayerName, setEditLayerName] = useState('');

      const [leftPanelTab, setLeftPanelTab] = useState('layers');
      const [showInfo, setShowInfo] = useState({
        venue: '', production: '', staffMeetingDate: '', setupDate: '',
        showDate: '', showTime: '', lightingDesigner: '', crew: ''
      });
      const [activeCategory, setActiveCategory] = useState('fixture');

      const [view, setView] = useState({ x: 500, y: 400, zoom: 1 });
      const [isPanning, setIsPanning] = useState(false);
      const [snapToGrid, setSnapToGrid] = useState(true);
      const [showAxis, setShowAxis] = useState(true);
      
      const [placingFixture, setPlacingFixture] = useState(null);
      const [hoverPos, setHoverPos] = useState(null);
      
      const [dragInfo, setDragInfo] = useState(null);
      const [pdfExportMode, setPdfExportMode] = useState(false);
      const [exportBox, setExportBox] = useState(null);
      const [clipboard, setClipboard] = useState([]);
      const [showEquipList, setShowEquipList] = useState(false);
      const equipListRef = useRef(null);

      const [pageSize, setPageSize] = useState(null);
      const [showNewDocModal, setShowNewDocModal] = useState(false);
      const [newDocSetting, setNewDocSetting] = useState({ preset: 'A4', orientation: 'landscape', useCustom: false, customW: 420, customH: 297 });

      const [autoChannelPort, setAutoChannelPort] = useState('');
      const [autoChannelStart, setAutoChannelStart] = useState(1);
      const [autoChannelStep, setAutoChannelStep] = useState(1);

      const [customSymbolNames, setCustomSymbolNames] = useState({});
      const [editingSymbolId, setEditingSymbolId] = useState(null);
      const [editSymbolName, setEditSymbolName] = useState('');

      const containerRef = useRef(null);
      const fileInputRef = useRef(null); 
      const imageInputRef = useRef(null);
      const symbolInputRef = useRef(null);
      const [toastMsg, setToastMsg] = useState(''); 

      const [aiThemeInput, setAiThemeInput] = useState('');
      const [isAiThemeLoading, setIsAiThemeLoading] = useState(false);

      const [customSymbols, setCustomSymbols] = useState([]);
      const [isDarkMode, setIsDarkMode] = useState(true);
      const [showUI, setShowUI] = useState(true);

      const [is3DView, setIs3DView] = useState(false);
      const [show3DBeams, setShow3DBeams] = useState(true);
      const [view3DKey, setView3DKey] = useState(0);

      const historyRef = useRef([[]]);
      const historyIndexRef = useRef(0);
      const historyTimeoutRef = useRef(null);
      const isDraggingRef = useRef(false);

      const pushHistory = useCallback((newFixtures) => {
        const currentHist = historyRef.current;
        const currentIndex = historyIndexRef.current;
        if (currentIndex >= 0 && JSON.stringify(currentHist[currentIndex]) === JSON.stringify(newFixtures)) return;
        const newHist = currentHist.slice(0, currentIndex + 1);
        newHist.push(newFixtures);
        if (newHist.length > 50) newHist.shift();
        historyRef.current = newHist;
        historyIndexRef.current = newHist.length - 1;
      }, []);

      const pushHistoryDebounced = useCallback((newFixtures) => {
        clearTimeout(historyTimeoutRef.current);
        historyTimeoutRef.current = setTimeout(() => pushHistory(newFixtures), 300);
      }, [pushHistory]);

      const pushHistoryImmediate = useCallback((newFixtures) => {
         clearTimeout(historyTimeoutRef.current);
         pushHistory(newFixtures);
      }, [pushHistory]);

      const undo = useCallback(() => {
        if (historyIndexRef.current > 0) {
          clearTimeout(historyTimeoutRef.current);
          historyIndexRef.current -= 1;

          setSelectedIds([]);
          showToast("실행 취소");
        }
      }, []);

      const redo = useCallback(() => {
        if (historyIndexRef.current < historyRef.current.length - 1) {
          clearTimeout(historyTimeoutRef.current);
          historyIndexRef.current += 1;
          setFixtures(historyRef.current[historyIndexRef.current]);
          setSelectedIds([]);
          showToast("다시 실행");
        }
      }, []);

      const themeVars = isDarkMode ? {
        bg: '#0f172a', grid: 'rgba(255,255,255,0.05)', dimLine: '#475569', dimText: '#94a3b8', dimTextZero: '#cbd5e1', fixtureNormal: '#e2e8f0', fixtureSelected: '#818cf8', libNormal: '#94a3b8', libPlacing: '#a5b4fc'
      } : {
        bg: '#f8fafc', grid: 'rgba(0,0,0,0.05)', dimLine: '#94a3b8', dimText: '#64748b', dimTextZero: '#334155', fixtureNormal: '#334155', fixtureSelected: '#4f46e5', libNormal: '#64748b', libPlacing: '#6366f1'
      };

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3000); 
      };

      const handleCenterView = useCallback(() => {
        if (containerRef.current) {
          const rect = containerRef.current.getBoundingClientRect();
          setView({ x: rect.width / 2, y: rect.height / 2 + 125, zoom: 1 });
        }
      }, []);

      useEffect(() => {
        const timer = setTimeout(() => handleCenterView(), 100);
        return () => clearTimeout(timer);
      }, [handleCenterView]);

      useEffect(() => { if (!placingFixture) setHoverPos(null); }, [placingFixture]);
      
      // Close Context Menu on any click
      useEffect(() => {
        const hideMenu = () => setContextMenu(null);
        window.addEventListener('pointerdown', hideMenu);
        return () => window.removeEventListener('pointerdown', hideMenu);
      }, []);

      const getGroupedSelection = useCallback((baseIds, currentFixtures) => {
        const groupIds = new Set(currentFixtures.filter(f => baseIds.includes(f.id) && f.groupId).map(f => f.groupId));
        return currentFixtures.filter(f => baseIds.includes(f.id) || (f.groupId && groupIds.has(f.groupId))).map(f => f.id);
      }, []);

      const handleGroup = useCallback(() => {
        if (selectedIds.length < 2) return;
        const newGroupId = `grp_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;
        const newF = fixtures.map(f => selectedIds.includes(f.id) ? { ...f, groupId: newGroupId } : f);
        setFixtures(newF); pushHistoryImmediate(newF);
        showToast("그룹화 완료");
      }, [selectedIds, fixtures, pushHistoryImmediate]);

      const handleUngroup = useCallback(() => {
        if (selectedIds.length === 0) return;
        const newF = fixtures.map(f => selectedIds.includes(f.id) ? { ...f, groupId: null } : f);
        setFixtures(newF); pushHistoryImmediate(newF);
        showToast("그룹 해제 완료");
      }, [selectedIds, fixtures, pushHistoryImmediate]);

      const handleAutoAssignChannel = useCallback(() => {
        const targets = fixtures.filter(f => selectedIds.includes(f.id) && FIXTURE_TYPES[f.type]?.category === 'fixture');
        if (targets.length === 0) return;
        const sorted = [...targets].sort((a, b) => a.x - b.x || a.y - b.y);
        const start = Number(autoChannelStart) || 1;
        const step = Number(autoChannelStep) || 1;
        const fixedPort = autoChannelPort.trim();

        const channelMap = {};
        sorted.forEach((f, i) => {
          const num = start + i * step;
          let portPart = fixedPort;
          if (!portPart) {
            const existing = (f.channel || '').toString();
            const slashIdx = existing.indexOf('/');
            portPart = slashIdx !== -1 ? existing.slice(0, slashIdx) : '';
          }
          channelMap[f.id] = portPart ? `${portPart}/${num}` : `${num}`;
        });

        const newF = fixtures.map(f => channelMap[f.id] !== undefined ? { ...f, channel: channelMap[f.id] } : f);
        setFixtures(newF); pushHistoryImmediate(newF);
        showToast(`${sorted.length}개 기구에 채널이 자동 배정되었습니다.`);
      }, [fixtures, selectedIds, autoChannelPort, autoChannelStart, autoChannelStep, pushHistoryImmediate]);

      const handleSelectAll = useCallback(() => {
        setSelectedIds(fixtures.filter(f => {
          const l = layers.find(x => x.id === (f.layerId || 'layer_default'));
          return l ? (!l.locked && l.visible) : true;
        }).map(f => f.id));
      }, [fixtures, layers]);

      const handleCreateNewDoc = () => {
        if (fixtures.length > 0 && !window.confirm("현재 작업 내용이 모두 사라집니다. 새 문서를 만드시겠습니까?")) return;
        const newPage = computePageSize(newDocSetting);
        setFixtures([]);
        historyRef.current = [[]]; historyIndexRef.current = 0;
        setSelectedIds([]);
        setLayers([
          { id: 'layer_structure', name: '구조물 레이어', visible: true, locked: false },
          { id: 'layer_fixture', name: '조명기 레이어', visible: true, locked: false },
          { id: 'layer_default', name: '기본 레이어', visible: true, locked: false }
        ]);
        setActiveLayerId('layer_fixture');
        setPageSize(newPage);
        setShowNewDocModal(false);
        handleCenterView();
        showToast(`${newPage.label} 새 문서가 생성되었습니다.`);
      };

      const saveFileHelper = async (blob, filename, description, mimeType, ext) => {
        try {
          if (window.showSaveFilePicker) {
            try {
              const handle = await window.showSaveFilePicker({ suggestedName: filename, types: [{ description: description, accept: { [mimeType]: [ext] } }] });
              const writable = await handle.createWritable();
              await writable.write(blob);
              await writable.close();
              showToast(`${description} 저장 완료`);
              return; 
            } catch (err) { if (err.name === 'AbortError') return; }
          }
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = filename;
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast(`${description}이(가) 저장되었습니다.`);
        } catch (error) { showToast("파일 저장 오류"); }
      };

      const handleSaveData = async () => {
        const data = { fixtures, layers, showInfo, customSymbolNames, customSymbols, pageSize };
        const jsonString = JSON.stringify(data, null, 2);
        const defaultFilename = `light_plot_${new Date().toISOString().slice(0, 10)}.json`;
        const userInput = prompt("저장할 파일 이름을 입력하세요:", defaultFilename);
        if (!userInput) return; 
        const blob = new Blob([jsonString], { type: 'application/json' });
        await saveFileHelper(blob, userInput.endsWith('.json') ? userInput : `${userInput}.json`, '도면 데이터', 'application/json', '.json');
      };

      const handleLoadData = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.fixtures && data.layers) {
              setFixtures(data.fixtures);
              historyRef.current = [data.fixtures]; historyIndexRef.current = 0;
              setLayers(data.layers);
              if (data.showInfo !== undefined) setShowInfo(data.showInfo);
              if (data.customSymbolNames !== undefined) setCustomSymbolNames(data.customSymbolNames);
              if (data.customSymbols !== undefined) setCustomSymbols(data.customSymbols);
              if (data.pageSize !== undefined) setPageSize(data.pageSize);
              setSelectedIds([]); setActiveLayerId(data.layers[0]?.id || 'layer_default');
              showToast("도면 불러오기 성공");
            }
          } catch (err) { showToast("파일 읽기 오류"); }
        };
        reader.readAsText(file);
        e.target.value = null; 
      };

      const handleImageUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const processImage = (dataUrl) => {
          const img = new window.Image();
          img.onload = () => {
            let initW = img.width, initH = img.height;
            const maxDim = 800;
            if (initW > maxDim || initH > maxDim) {
              const ratio = initW / initH;
              if (initW > initH) { initW = maxDim; initH = maxDim / ratio; } else { initH = maxDim; initW = maxDim * ratio; }
            }
            const rect = containerRef.current.getBoundingClientRect();
            let canvasX = (rect.width / 2 - view.x) / view.zoom;
            let canvasY = (rect.height / 2 - view.y) / view.zoom;
            if (snapToGrid) { canvasX = Math.round(canvasX / 5) * 5; canvasY = Math.round(canvasY / 5) * 5; }

            const newFixture = { id: `fix_${Date.now()}`, type: 'IMAGE', name: file.type === 'application/pdf' ? 'PDF 도면' : '이미지', x: canvasX, y: canvasY, rotation: 0, width: initW, height: initH, scale: 1, opacity: 1, bgColor: '', dash: '', rx: 0, layerId: activeLayerId, src: dataUrl };
            const newF = [...fixtures, newFixture];
            setFixtures(newF); pushHistoryImmediate(newF); setSelectedIds([newFixture.id]);
            showToast(file.type === 'application/pdf' ? "PDF 도면이 추가되었습니다." : "이미지가 추가되었습니다.");
          };
          img.src = dataUrl;
        };

        if (file.type === 'application/pdf') {
          showToast("PDF를 변환 중입니다. 잠시만 기다려주세요...");
          try {
            const arrayBuffer = await file.arrayBuffer();
            const pdfjsLib = window['pdfjs-dist/build/pdf'] || window.pdfjsLib;
            if (!pdfjsLib) throw new Error("PDF.js 라이브러리가 로드되지 않았습니다.");
            
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
            
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            const page = await pdf.getPage(1); // 1페이지 추출
            const viewport = page.getViewport({ scale: 2.0 }); // 고해상도 변환
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            
            await page.render({ canvasContext: context, viewport: viewport }).promise;
            processImage(canvas.toDataURL('image/png'));
          } catch (err) {
            console.error(err);
            showToast("PDF 변환 중 오류가 발생했습니다.");
          }
        } else {
          const reader = new FileReader();
          reader.onload = (event) => processImage(event.target.result);
          reader.readAsDataURL(file);
        }
        e.target.value = null; 
      };

      const handleSymbolUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const ext = file.name.split('.').pop().toLowerCase();
        
        // AI, CAD 등 브라우저 미지원 포맷 안내

          e.target.value = null;
          return;
        }

        // 파일 확장자를 제외한 이름을 심볼 이름으로 사용
        const symbolName = file.name.replace(/\.[^/.]+$/, "");

        if (file.type === 'application/pdf' || ext === 'pdf') {
          showToast("PDF 심볼을 변환 중입니다...");
          try {
            const arrayBuffer = await file.arrayBuffer();
            const pdfjsLib = window['pdfjs-dist/build/pdf'] || window.pdfjsLib;
            if (!pdfjsLib) throw new Error("PDF.js 라이브러리가 로드되지 않았습니다.");
            
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
            
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            const page = await pdf.getPage(1);
            const viewport = page.getViewport({ scale: 2.0 }); // 고해상도 추출
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            
            await page.render({ canvasContext: context, viewport: viewport }).promise;
            
            const newSymbol = { id: `csym_${Date.now()}`, name: symbolName, src: canvas.toDataURL('image/png') };
            setCustomSymbols(prev => [...prev, newSymbol]);
            showToast("PDF 심볼 추가됨");
          } catch (err) {
            console.error(err);
            showToast("PDF 변환 중 오류가 발생했습니다.");
          }
        } else {
          const reader = new FileReader();
          reader.onload = (event) => {
            const newSymbol = { id: `csym_${Date.now()}`, name: symbolName, src: event.target.result };
            setCustomSymbols(prev => [...prev, newSymbol]);
            showToast("이미지 심볼 추가됨");
          };
          reader.readAsDataURL(file);
        }
        e.target.value = null;
      };

      const handleAiThemeSetting = async () => {
        if (selectedIds.length === 0 || !aiThemeInput.trim()) return;
        setIsAiThemeLoading(true);
        try {
          const prompt = `연출 테마: "${aiThemeInput}"\n선택된 조명기구 수: ${selectedIds.length}개.\n이 테마를 완벽하게 표현할 수 있도록 정확히 ${selectedIds.length}개의 객체를 포함한 JSON 배열을 반환해 주세요.`;
          const resultStr = await callGemini(prompt, `무대 조명 디자이너로서 선택된 테마에 어울리는 조명 젤 컬러(Rosco, Lee 등)와 연출 목적을 JSON 배열로 반환하세요. 예: [{"color": "R02", "purpose": "따뜻한 아침햇살"}]`, true);
          let cleanJsonStr = resultStr.replace(/```json/g, '').replace(/```/g, '').trim();
          const themeResult = JSON.parse(cleanJsonStr);

          if (Array.isArray(themeResult) && themeResult.length >= selectedIds.length) {
            const newF = fixtures.map(f => {
              const selIdx = selectedIds.indexOf(f.id);
              if (selIdx !== -1 && themeResult[selIdx]) return { ...f, color: themeResult[selIdx].color, purpose: themeResult[selIdx].purpose };
              return f;
            });
            setFixtures(newF); pushHistoryImmediate(newF);
            showToast(`✨ '${aiThemeInput}' 테마 적용 완료!`);
            setAiThemeInput('');
          }
        } catch (error) { showToast("AI 테마 적용 오류"); } finally { setIsAiThemeLoading(false); }
      };

      const buildShowInfoFooterCanvas = (widthMM, heightMM) => {
        const pxPerMM = 8;
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(widthMM * pxPerMM);
        canvas.height = Math.round(heightMM * pxPerMM);
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, 1); ctx.lineTo(canvas.width, 1); ctx.stroke();

        const fields = [
          { label: '공연장', value: showInfo.venue },
          { label: '공연작품', value: showInfo.production },
          { label: '스탭회의', value: showInfo.staffMeetingDate },
          { label: '셋업일자', value: showInfo.setupDate },
          { label: '공연일', value: showInfo.showDate },
          { label: '공연시간', value: showInfo.showTime },
          { label: '조명디자이너', value: showInfo.lightingDesigner },
          { label: '크루', value: (showInfo.crew || '').replace(/\n+/g, ', ') },
        ];
        const colWidth = canvas.width / fields.length;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        fields.forEach((f, i) => {
          const cx = colWidth * i + colWidth / 2;
          if (i > 0) {
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(colWidth * i, canvas.height * 0.15);
            ctx.lineTo(colWidth * i, canvas.height * 0.85);
            ctx.stroke();
          }
          ctx.fillStyle = '#64748b';
          ctx.font = `bold ${Math.round(canvas.height * 0.2)}px sans-serif`;
          ctx.fillText(f.label, cx, canvas.height * 0.32);
          ctx.fillStyle = '#0f172a';
          ctx.font = `${Math.round(canvas.height * 0.2)}px sans-serif`;
          ctx.fillText((f.value || '-').toString().slice(0, 14), cx, canvas.height * 0.68);
        });
        return canvas;
      };

      const generatePDF = async (box) => {
        showToast("PDF 생성 중...");
        try {
          setSelectedIds([]);
          const canvasElement = containerRef.current;
          const scale = 3;
          const fullCanvas = await window.html2canvas(canvasElement, { backgroundColor: themeVars.bg, scale: scale, useCORS: true });

          const boxX = Math.min(box.startX, box.currX), boxY = Math.min(box.startY, box.currY);
          const boxWidth = Math.abs(box.currX - box.startX), boxHeight = Math.abs(box.currY - box.startY);
          const croppedCanvas = document.createElement('canvas');
          croppedCanvas.width = boxWidth * scale; croppedCanvas.height = boxHeight * scale;
          croppedCanvas.getContext('2d').drawImage(fullCanvas, boxX * scale, boxY * scale, boxWidth * scale, boxHeight * scale, 0, 0, boxWidth * scale, boxHeight * scale);

          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({ orientation: boxWidth > boxHeight ? 'landscape' : 'portrait', unit: 'mm', format: 'a4' });
          const pageWidth = pdf.internal.pageSize.getWidth();
          const pageHeight = pdf.internal.pageSize.getHeight();
          const footerHeightMM = 16;
          const imageHeightMM = pageHeight - footerHeightMM;

          pdf.addImage(croppedCanvas.toDataURL('image/png'), 'PNG', 0, 0, pageWidth, imageHeightMM);
          const footerCanvas = buildShowInfoFooterCanvas(pageWidth, footerHeightMM);
          pdf.addImage(footerCanvas.toDataURL('image/png'), 'PNG', 0, imageHeightMM, pageWidth, footerHeightMM);

          const userInput = prompt("저장할 PDF 파일 이름:", `light_plot_export_${new Date().toISOString().slice(0, 10)}.pdf`);
          if (userInput) await saveFileHelper(pdf.output('blob'), userInput.endsWith('.pdf') ? userInput : `${userInput}.pdf`, 'PDF 도면', 'application/pdf', '.pdf');
        } catch (error) { showToast("PDF 오류 발생"); }
      };

      const handleCopy = useCallback(() => {
        if (selectedIds.length === 0) return;
        const toCopy = fixtures.filter(f => selectedIds.includes(f.id));
        setClipboard(toCopy);
        showToast(`${toCopy.length}개 항목이 복사되었습니다.`);
      }, [selectedIds, fixtures]);

      const handlePaste = useCallback(() => {
        if (clipboard.length === 0) return;
        const offset = snapToGrid ? 25 : 10;
        const groupIdMap = {};

        const newFixtures = clipboard.map(item => {
          let newGroupId = item.groupId;
          if (item.groupId) {
            if (!groupIdMap[item.groupId]) {
              groupIdMap[item.groupId] = `grp_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;
            }
            newGroupId = groupIdMap[item.groupId];
          }
          return {
            ...item,
            id: `fix_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`,
            groupId: newGroupId,
            x: item.x + offset,
            y: item.y + offset,
            layerId: activeLayerId
          };
        });
        const newF = [...fixtures, ...newFixtures];
        setFixtures(newF); pushHistoryImmediate(newF);
        setSelectedIds(newFixtures.map(f => f.id));
        setClipboard(newFixtures);
        showToast(`${newFixtures.length}개 항목이 붙여넣기 되었습니다.`);
      }, [clipboard, activeLayerId, snapToGrid, fixtures, pushHistoryImmediate]);

      const handleDuplicate = useCallback(() => {
        if (selectedIds.length === 0) return;
        const toDup = fixtures.filter(f => selectedIds.includes(f.id));
        const offset = snapToGrid ? 25 : 10;
        const groupIdMap = {};

        const newFixtures = toDup.map(item => {
          let newGroupId = item.groupId;
          if (item.groupId) {
            if (!groupIdMap[item.groupId]) {
              groupIdMap[item.groupId] = `grp_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;
            }
            newGroupId = groupIdMap[item.groupId];
          }
          return {
            ...item,
            id: `fix_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`,
            groupId: newGroupId,
            x: item.x + offset,
            y: item.y + offset
          };
        });
        const newF = [...fixtures, ...newFixtures];
        setFixtures(newF); pushHistoryImmediate(newF);
        setSelectedIds(newFixtures.map(f => f.id));
        showToast(`${newFixtures.length}개 항목이 복제되었습니다.`);
      }, [selectedIds, fixtures, snapToGrid, pushHistoryImmediate]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          const isInputFocused = ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName);
          if (e.key === 'Tab' && !isInputFocused) { e.preventDefault(); setShowUI(prev => !prev); } 
          else if (e.key === 'Escape') { setPlacingFixture(null); setSelectedIds([]); setPdfExportMode(false); setExportBox(null); setShowUI(true); setShowEquipList(false); }
          else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !isInputFocused) { e.preventDefault(); e.shiftKey ? redo() : undo(); } 
          else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y' && !isInputFocused) { e.preventDefault(); redo(); } 
          else if ((e.key === 'Delete' || e.key === 'Backspace') && !isInputFocused && selectedIds.length > 0) {
            const newF = fixtures.filter(f => !selectedIds.includes(f.id)); setFixtures(newF); pushHistoryImmediate(newF); setSelectedIds([]);
          } 
          else if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key) && !isInputFocused && selectedIds.length > 0) {
            e.preventDefault();
            const step = snapToGrid ? 5 : 1; 
            let dx = 0, dy = 0;
            if (e.key === 'ArrowUp') dy = -step; if (e.key === 'ArrowDown') dy = step;
            if (e.key === 'ArrowLeft') dx = -step; if (e.key === 'ArrowRight') dx = step;
            const newF = fixtures.map(f => selectedIds.includes(f.id) ? { ...f, x: f.x + dx, y: f.y + dy } : f);
            setFixtures(newF); pushHistoryDebounced(newF);
          }
          else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c' && !isInputFocused) { e.preventDefault(); handleCopy(); }
          else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v' && !isInputFocused) { e.preventDefault(); handlePaste(); }
          else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd' && !isInputFocused) { e.preventDefault(); handleDuplicate(); }
          else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'g' && !isInputFocused) { 
            e.preventDefault(); 
            if (e.shiftKey) handleUngroup(); 
            else handleGroup(); 
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [selectedIds, snapToGrid, fixtures, pushHistoryImmediate, pushHistoryDebounced, undo, redo, handleCopy, handlePaste, handleDuplicate, handleGroup, handleUngroup]);

      const handleWheel = (e) => {
        e.preventDefault();
        setView(prev => ({...prev, zoom: Math.max(0.2, Math.min(prev.zoom - e.deltaY * 0.001, 3))}));
      };

      const placeFixtureAt = (rawX, rawY) => {
        if (!placingFixture) return;
        let newX = rawX, newY = rawY;
        if (snapToGrid) { newX = Math.round(newX / 5) * 5; newY = Math.round(newY / 5) * 5; }

        const isCustom = placingFixture.startsWith('csym_');
        const typeKey = isCustom ? 'CUSTOM_SYMBOL' : placingFixture;
        const tInfo = FIXTURE_TYPES[typeKey];
        const isVenue = tInfo.category === 'venue';
        const isShape = tInfo.category === 'shape';
        const isMemo = tInfo.category === 'memo';
        const isImg = tInfo.category === 'image';

        let symSrc = '', symName = tInfo.name;
        if (isCustom) {
           const sym = customSymbols.find(s => s.id === placingFixture);
           if (sym) { symSrc = sym.src; symName = customSymbolNames[placingFixture] || sym.name; }
        } else { symName = customSymbolNames[placingFixture] || tInfo.name; }

        const newF = [...fixtures, {
          id: `fix_${Date.now()}`, type: typeKey, customSymbolId: isCustom ? placingFixture : undefined,
          name: symName, x: newX, y: newY, rotation: 0,
          width: isVenue ? 500 : ((isShape || isMemo || isImg) ? 150 : 300),
          height: isVenue ? 400 : ((isShape || isImg) ? 100 : (isMemo ? 50 : undefined)),
          thickness: (isShape || isVenue) ? 2 : undefined, scale: 1, opacity: 1, bgColor: '', dash: '', rx: 0, layerId: activeLayerId, src: symSrc
        }];
        setFixtures(newF); pushHistoryImmediate(newF); setSelectedIds([newF[newF.length-1].id]);
        setPlacingFixture(null); setHoverPos(null);
      };

      const selectFixtureFrom3D = (id, shiftKey) => {
        const fixture = fixtures.find(f => f.id === id);
        if (!fixture) return;
        const layer = layers.find(l => l.id === (fixture.layerId || 'layer_default'));
        if (layer && layer.locked) return;
        let newSel = [...selectedIds];
        if (shiftKey) {
          if (newSel.includes(id)) {
            newSel = fixture.groupId ? newSel.filter(x => fixtures.find(f => f.id === x)?.groupId !== fixture.groupId) : newSel.filter(x => x !== id);
          } else newSel.push(id);
        } else if (!newSel.includes(id)) {
          newSel = [id];
        }
        setSelectedIds(getGroupedSelection(newSel, fixtures));
      };

      const deselectAll3D = (shiftKey) => { if (!shiftKey) setSelectedIds([]); };

      const handlePointerDown = (e) => {
        if (e.button === 2) return; // 우클릭 시 컨텍스트 메뉴를 띄우기 위해 드래그 등 기본동작 패스
        if (pdfExportMode) {
          const rect = containerRef.current.getBoundingClientRect();
          setExportBox({ startX: e.clientX - rect.left, startY: e.clientY - rect.top, currX: e.clientX - rect.left, currY: e.clientY - rect.top });
          return;
        }

        if (placingFixture) {
          const rect = containerRef.current.getBoundingClientRect();
          const newX = (e.clientX - rect.left - view.x) / view.zoom;
          const newY = (e.clientY - rect.top - view.y) / view.zoom;
          placeFixtureAt(newX, newY);
          return;
        }

        if (e.target.closest('.fixture-node') || e.target.closest('.rotate-handle')) return;
        
        if (activeTool === 'pan' || e.button === 1) {
          setIsPanning(true); setDragInfo({ startX: e.clientX, startY: e.clientY, origViewX: view.x, origViewY: view.y });
        } else {
          isDraggingRef.current = true; if (!e.shiftKey) setSelectedIds([]);
          const rect = containerRef.current.getBoundingClientRect();
          setSelectionBox({ startX: e.clientX - rect.left, startY: e.clientY - rect.top, currX: e.clientX - rect.left, currY: e.clientY - rect.top, initialSelectedIds: e.shiftKey ? [...selectedIds] : [] });
        }
      };

      const handlePointerMove = (e) => {
        if (placingFixture) {
          const rect = containerRef.current.getBoundingClientRect();
          let newX = (e.clientX - rect.left - view.x) / view.zoom; let newY = (e.clientY - rect.top - view.y) / view.zoom;
          if (snapToGrid) { newX = Math.round(newX / 5) * 5; newY = Math.round(newY / 5) * 5; }
          setHoverPos({ x: newX, y: newY }); return;
        }

        if (pdfExportMode && exportBox) {
          const rect = containerRef.current.getBoundingClientRect();
          const mouseX = e.clientX - rect.left, mouseY = e.clientY - rect.top;
          const rawW = Math.abs(mouseX - exportBox.startX), rawH = Math.abs(mouseY - exportBox.startY);
          if (rawW > 0 || rawH > 0) {
            const isLand = rawW > rawH; const a4 = Math.sqrt(2);
            let fW = rawW, fH = rawH;
            if (isLand) { if (rawW / (rawH || 1) > a4) fH = rawW / a4; else fW = rawH * a4; }
            else { if (rawH / (rawW || 1) > a4) fW = rawH / a4; else fH = rawW * a4; }
            setExportBox(prev => ({ ...prev, currX: exportBox.startX + (mouseX >= exportBox.startX ? fW : -fW), currY: exportBox.startY + (mouseY >= exportBox.startY ? fH : -fH) }));
          }
          return;
        }

        if (isPanning && dragInfo) {
          setView(prev => ({ ...prev, x: dragInfo.origViewX + (e.clientX - dragInfo.startX), y: dragInfo.origViewY + (e.clientY - dragInfo.startY) }));
        } else if (selectionBox) {
          const rect = containerRef.current.getBoundingClientRect();
          const currX = e.clientX - rect.left, currY = e.clientY - rect.top;
          setSelectionBox(prev => ({ ...prev, currX, currY }));
          const minX = Math.min(selectionBox.startX, currX), maxX = Math.max(selectionBox.startX, currX);
          const minY = Math.min(selectionBox.startY, currY), maxY = Math.max(selectionBox.startY, currY);
          const cMinX = (minX - view.x) / view.zoom, cMaxX = (maxX - view.x) / view.zoom;
          const cMinY = (minY - view.y) / view.zoom, cMaxY = (maxY - view.y) / view.zoom;
          
          const newSelIds = fixtures.filter(f => {
            const l = layers.find(x => x.id === (f.layerId || 'layer_default'));
            if (l && (l.locked || !l.visible)) return false;
            return f.x >= cMinX && f.x <= cMaxX && f.y >= cMinY && f.y <= cMaxY;
          }).map(f => f.id);
          setSelectedIds(getGroupedSelection(e.shiftKey ? Array.from(new Set([...selectionBox.initialSelectedIds, ...newSelIds])) : newSelIds, fixtures));
        } else if (dragInfo && dragInfo.type === 'resize') {
          const rect = containerRef.current.getBoundingClientRect();
          const dx = ((e.clientX - rect.left - view.x) / view.zoom) - dragInfo.startX;
          const dy = ((e.clientY - rect.top - view.y) / view.zoom) - dragInfo.startY;
          const tFix = fixtures.find(f => f.id === dragInfo.targetId);
          
          if (tFix) {
            if (FIXTURE_TYPES[tFix.type].category === 'fixture') {
               const dist = Math.sqrt(dx*dx + dy*dy);
               const sign = (dx + dy) > 0 ? 1 : -1;
               let newScale = dragInfo.startScale + (sign * dist * 0.01);
               newScale = Math.max(0.1, Math.min(newScale, 10)); 
               setFixtures(fixtures.map(f => f.id === tFix.id ? { ...f, scale: newScale } : f));
            } else {
               const angle = (tFix.rotation || 0) * (Math.PI / 180);
               const localDx = (dx * Math.cos(-angle) - dy * Math.sin(-angle)) / (tFix.scale || 1);
               const localDy = (dx * Math.sin(-angle) + dy * Math.cos(-angle)) / (tFix.scale || 1);
               let updates = {};
               if (dragInfo.handlePos.includes('e')) updates.width = Math.max(20, dragInfo.startW + localDx * 2);
               if (dragInfo.handlePos.includes('s')) updates.height = Math.max(20, dragInfo.startH + localDy * 2);
               if (snapToGrid) {
                 if (updates.width) updates.width = Math.max(50, Math.round(updates.width / 50) * 50);
                 if (updates.height) updates.height = Math.max(50, Math.round(updates.height / 50) * 50);
               }
               setFixtures(fixtures.map(f => f.id === tFix.id ? { ...f, ...updates } : f));
            }
          }
        } else if (dragInfo && dragInfo.type === 'fixture') {
          let rDx = e.clientX - dragInfo.startX, rDy = e.clientY - dragInfo.startY;
          if (e.shiftKey) { if (Math.abs(rDx) > Math.abs(rDy)) rDy = 0; else rDx = 0; }
          const dx = rDx / view.zoom, dy = rDy / view.zoom;
          setFixtures(fixtures.map(f => {
            const item = dragInfo.items.find(x => x.id === f.id);
            if (item) {
              let nx = item.ox + dx, ny = item.oy + dy;
              if (snapToGrid) { nx = Math.round(nx/5)*5; ny = Math.round(ny/5)*5; }
              return { ...f, x: nx, y: ny };
            }
            return f;
          }));
        } else if (dragInfo && dragInfo.type === 'rotate') {
          const rect = containerRef.current.getBoundingClientRect();
          const tFix = fixtures.find(f => f.id === dragInfo.targetId);
          if (tFix) {
            let angle = Math.atan2(((e.clientY - rect.top - view.y) / view.zoom) - tFix.y, ((e.clientX - rect.left - view.x) / view.zoom) - tFix.x) * (180 / Math.PI) + 90;
            angle = (angle % 360 + 360) % 360;
            if (snapToGrid) { angle = Math.round(angle / 15) * 15; if (angle === 360) angle = 0; }
            setFixtures(fixtures.map(f => selectedIds.includes(f.id) ? { ...f, rotation: Math.round(angle) } : f));
          }
        }
      };

      const handlePointerUp = () => {
        if (pdfExportMode && exportBox) {
          const box = { ...exportBox }; setExportBox(null); setPdfExportMode(false);
          if (Math.abs(box.currX - box.startX) < 50) { showToast("영역이 너무 작습니다."); return; }
          setTimeout(() => generatePDF(box), 100); return;
        }
        if (isDraggingRef.current) { pushHistoryImmediate(fixtures); isDraggingRef.current = false; }
        setIsPanning(false); setDragInfo(null); setSelectionBox(null);
      };

      const handleFixturePointerDown = (e, fixture) => {
        if (pdfExportMode) return; e.stopPropagation();
        const layer = layers.find(l => l.id === (fixture.layerId || 'layer_default'));
        if (layer && layer.locked) return;
        
        let newSel = [...selectedIds];
        // 우클릭이면 객체를 선택하되 드래그는 발생시키지 않음
        if (e.button === 2) {
          if (!newSel.includes(fixture.id)) {
            newSel = [fixture.id];
            setSelectedIds(getGroupedSelection(newSel, fixtures));
          }
          return;
        }

        if (e.shiftKey) {
          if (newSel.includes(fixture.id)) {
            if (fixture.groupId) newSel = newSel.filter(id => fixtures.find(x => x.id === id)?.groupId !== fixture.groupId);
            else newSel = newSel.filter(id => id !== fixture.id);
          } else newSel.push(fixture.id);
        } else if (!newSel.includes(fixture.id)) newSel = [fixture.id];
        
        const fSel = getGroupedSelection(newSel, fixtures);
        setSelectedIds(fSel); isDraggingRef.current = true;
        setDragInfo({ type: 'fixture', startX: e.clientX, startY: e.clientY, items: fixtures.filter(f => fSel.includes(f.id)).map(f => ({ id: f.id, ox: f.x, oy: f.y })) });
      };

      const handleResizePointerDown = (e, fixture, handlePos) => {
        if (pdfExportMode) return; e.stopPropagation();
        if (layers.find(l => l.id === (fixture.layerId || 'layer_default'))?.locked) return;
        if (!selectedIds.includes(fixture.id)) setSelectedIds([fixture.id]);
        isDraggingRef.current = true;
        const rect = containerRef.current.getBoundingClientRect();
        setDragInfo({ type: 'resize', targetId: fixture.id, handlePos, startX: (e.clientX - rect.left - view.x) / view.zoom, startY: (e.clientY - rect.top - view.y) / view.zoom, startW: fixture.width || 150, startH: fixture.height || 100, startScale: fixture.scale || 1 });
      };

      const handleRotatePointerDown = (e, fixture) => {
        if (pdfExportMode) return; e.stopPropagation();
        isDraggingRef.current = true; setDragInfo({ type: 'rotate', targetId: fixture.id });
      };

      const updateSelectedFixtures = (key, value) => {
        if (selectedIds.length === 0) return;
        const newF = fixtures.map(f => selectedIds.includes(f.id) ? { ...f, [key]: value } : f);
        setFixtures(newF); pushHistoryDebounced(newF);
      };

      const deleteSelectedFixtures = () => {
        if (selectedIds.length === 0) return;
