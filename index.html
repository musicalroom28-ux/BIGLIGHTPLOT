        const newF = fixtures.filter(f => !selectedIds.includes(f.id));
        setFixtures(newF); pushHistoryImmediate(newF); setSelectedIds([]);
        setContextMenu(null); // 삭제 후 메뉴 닫기
      };

      const firstSel = selectedIds.length > 0 ? fixtures.find(f => f.id === selectedIds[0]) : null;
      const typeInfo = firstSel ? FIXTURE_TYPES[firstSel.type] : null;
      
      const getLibItems = () => {
        let i = Object.values(FIXTURE_TYPES).filter(f => f.category === activeCategory);
        if (activeCategory === 'fixture') i = [...i, ...customSymbols.map(s => ({ ...FIXTURE_TYPES.CUSTOM_SYMBOL, id: s.id, name: s.name, src: s.src }))].filter(x => x.id !== 'CUSTOM_SYMBOL');
        return i;
      };

      const getSortOrder = (type) => {
        const cat = FIXTURE_TYPES[type]?.category;
        return { 'image': 1, 'venue': 2, 'shape': 3, 'structure': 4, 'fixture': 5, 'memo': 6 }[cat] || 0;
      };

      // 바닥(도면)에 배치된 조명 심볼을 종류별로 자동 집계 (숨김 레이어는 제외)
      const equipmentList = useMemo(() => {
        const groups = {};
        fixtures.forEach(f => {
          const tInfo = FIXTURE_TYPES[f.type];
          if (!tInfo || tInfo.category !== 'fixture') return;
          const layer = layers.find(l => l.id === (f.layerId || 'layer_default'));
          if (layer && layer.visible === false) return;

          const isCustom = f.type === 'CUSTOM_SYMBOL';
          const key = isCustom ? `custom_${f.customSymbolId}` : f.type;
          if (!groups[key]) {
            const customSym = isCustom ? customSymbols.find(s => s.id === f.customSymbolId) : null;
            const defaultName = isCustom ? (customSym?.name || f.name) : tInfo.name;
            groups[key] = {
              key,
              name: customSymbolNames[key.replace('custom_', '')] || defaultName,
              count: 0,
              render: tInfo.render,
              src: isCustom ? (customSym?.src || f.src || '') : '',
              libraries: new Set(),
              totalWattage: 0
            };
          }
          groups[key].count += 1;
          if (f.library) groups[key].libraries.add(f.library);
          const wattNum = parseFloat((f.wattage || '').toString().replace(/[^0-9.]/g, ''));
          if (!isNaN(wattNum)) groups[key].totalWattage += wattNum;
        });
        return Object.values(groups).map(g => ({ ...g, library: [...g.libraries].join(', ') })).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
      }, [fixtures, layers, customSymbols, customSymbolNames]);

      const handleDownloadEquipListPDF = async () => {
        if (!equipListRef.current || equipmentList.length === 0) return;
        showToast("PDF 생성 중...");
        try {
          const canvas = await window.html2canvas(equipListRef.current, { backgroundColor: '#ffffff', scale: 2 });
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
          const margin = 10;
          const imgWidth = pdf.internal.pageSize.getWidth() - margin * 2;
          const pageHeight = pdf.internal.pageSize.getHeight() - margin * 2;
          const imgHeight = canvas.height * imgWidth / canvas.width;
          const imgData = canvas.toDataURL('image/png');

          let heightLeft = imgHeight;
          let position = margin;
          pdf.addImage(imgData, 'PNG', margin, position, imgWidth, imgHeight);
          heightLeft -= pageHeight;
          while (heightLeft > 0) {
            position = margin - (imgHeight - heightLeft);
            pdf.addPage();
            pdf.addImage(imgData, 'PNG', margin, position, imgWidth, imgHeight);
            heightLeft -= pageHeight;
          }

          const userInput = prompt("저장할 PDF 파일 이름:", `equipment_list_${new Date().toISOString().slice(0, 10)}.pdf`);
          if (userInput) await saveFileHelper(pdf.output('blob'), userInput.endsWith('.pdf') ? userInput : `${userInput}.pdf`, '장비 리스트 PDF', 'application/pdf', '.pdf');
        } catch (error) { console.error(error); showToast("PDF 생성 오류"); }
      };

      return (
        <div className={`flex h-screen w-full font-sans overflow-hidden ${isDarkMode ? 'dark' : ''}`}>
          <div className="flex h-full w-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200">
            
            {/* LEFT PANEL */}
            <div className={`w-48 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex-col z-10 shadow-xl ${showUI ? 'flex' : 'hidden'}`}>
              <div className="p-4 bg-slate-100 dark:bg-slate-900 border-b dark:border-slate-700">
                <h1 className="text-lg font-bold flex items-center gap-2"><Target className="w-5 h-5 text-indigo-600 dark:text-indigo-400" />BIGLIGHT PLOT</h1>
              </div>
              
              <div className="flex bg-slate-100 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700">
                <button onClick={() => setLeftPanelTab('layers')} className={`flex-1 py-2 text-xs font-bold border-b-2 flex justify-center items-center gap-1 ${leftPanelTab === 'layers' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 dark:text-slate-400'}`}><Layers className="w-3.5 h-3.5" /> 레이어</button>
                <button onClick={() => setLeftPanelTab('showInfo')} className={`flex-1 py-2 text-xs font-bold border-b-2 flex justify-center items-center gap-1 ${leftPanelTab === 'showInfo' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 dark:text-slate-400'}`}><FileText className="w-3.5 h-3.5" /> 공연정보</button>
              </div>

              <div className={`p-4 border-b border-slate-200 dark:border-slate-700 flex flex-col h-56 ${leftPanelTab === 'layers' ? 'overflow-hidden' : 'overflow-y-auto custom-scrollbar'}`}>
                {leftPanelTab === 'layers' ? (
                  <>
                    <div className="flex justify-between mb-3"><span className="text-xs font-semibold text-slate-500 dark:text-slate-400">목록</span><button onClick={() => {const id=`layer_${Date.now()}`; setLayers([{id, name:`새 레이어`, visible:true, locked:false}, ...layers]); setActiveLayerId(id);}}><Plus className="w-4 h-4 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white"/></button></div>
                    <div className="overflow-y-auto custom-scrollbar space-y-1">
                      {layers.map(l => (
                        <div key={l.id} onClick={() => setActiveLayerId(l.id)} className={`flex items-center p-2 rounded text-xs cursor-pointer ${activeLayerId === l.id ? 'bg-indigo-100 dark:bg-indigo-600/30' : 'hover:bg-slate-200 dark:hover:bg-slate-700'}`}>
                          {editingLayerId === l.id ? (
                            <input autoFocus value={editLayerName} onChange={e=>setEditLayerName(e.target.value)} onBlur={()=>{setLayers(layers.map(x=>x.id===l.id?{...x,name:editLayerName||'이름 없음'}:x)); setEditingLayerId(null);}} className="flex-1 w-0 bg-transparent outline-none border border-indigo-400 rounded px-1" />
                          ) : (
                            <span className="flex-1 truncate" onDoubleClick={()=>{setEditingLayerId(l.id);setEditLayerName(l.name);}}>{l.name}</span>
                          )}
                          <div className="flex gap-1">
                            <button onClick={e=>{e.stopPropagation(); setLayers(layers.map(x=>x.id===l.id?{...x,visible:!x.visible}:x));}}><Eye className={`w-3.5 h-3.5 ${!l.visible?'opacity-30':''}`} /></button>
                            <button onClick={e=>{e.stopPropagation(); setLayers(layers.map(x=>x.id===l.id?{...x,locked:!x.locked}:x));}}><Lock className={`w-3.5 h-3.5 ${l.locked?'text-red-500':'opacity-30'}`} /></button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </>
                ) : (
                  <div className="space-y-2">
                    {[
                      { key: 'venue', label: '공연장' },
                      { key: 'production', label: '공연작품' },
                      { key: 'staffMeetingDate', label: '스탭회의 날짜', type: 'date' },
                      { key: 'setupDate', label: '셋업일자', type: 'date' },
                      { key: 'showDate', label: '공연일', type: 'date' },
                      { key: 'showTime', label: '공연시간', type: 'time' },
                      { key: 'lightingDesigner', label: '조명디자이너' },
                    ].map(field => (
                      <div key={field.key}>
                        <label className="text-[10px] font-semibold text-slate-500 dark:text-slate-400 block mb-0.5">{field.label}</label>
                        <input
                          type={field.type || 'text'}
                          value={showInfo[field.key] || ''}
                          onChange={e => setShowInfo({ ...showInfo, [field.key]: e.target.value })}
                          className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded px-1.5 py-1 text-xs outline-none focus:border-indigo-500"
                        />
                      </div>
                    ))}
                    <div>
                      <label className="text-[10px] font-semibold text-slate-500 dark:text-slate-400 block mb-0.5">크루</label>
                      <textarea
                        value={showInfo.crew || ''}
                        onChange={e => setShowInfo({ ...showInfo, crew: e.target.value })}
                        rows={3}
                        className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded px-1.5 py-1 text-xs outline-none focus:border-indigo-500 resize-none custom-scrollbar"
                      />
                    </div>
                  </div>
                )}
              </div>

              <div className="flex bg-slate-100 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700">
                {['venue', 'structure', 'fixture', 'shape', 'memo'].map(cat => (
                  <button key={cat} onClick={() => setActiveCategory(cat)} className={`flex-1 py-1.5 text-[9px] font-bold border-b-2 tracking-tighter ${activeCategory === cat ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 dark:text-slate-400'}`}>
                    {{venue:'공연장', structure:'구조물', fixture:'조명', shape:'도형', memo:'메모'}[cat]}
                  </button>
                ))}
              </div>

              <div className="p-4 flex-1 overflow-y-auto custom-scrollbar">
                <div className="grid grid-cols-2 gap-2">
                  {getLibItems().map(f => {
                    const isPl = placingFixture === f.id;
                    const libW = f.category === 'venue' ? 60 : (f.category === 'shape' ? 60 : (f.category === 'memo' ? 80 : 300));
                    return (
                      <div key={f.id} className={`flex flex-col items-center justify-center p-2 rounded-lg border ${isPl ? 'bg-indigo-100 border-indigo-400' : 'bg-slate-50 dark:bg-slate-700/50'}`}>
                        <button onClick={() => setPlacingFixture(isPl ? null : f.id)} className="w-full h-10 flex justify-center items-center drop-shadow-md [&>svg]:max-w-[80px] [&>svg]:max-h-[35px]" title={f.name}>
                          {f.render('#64748b', libW, 0, 2, 40, f.name.split(' ')[0], f.src)}
                        </button>
                        <span className="text-[10px] text-center mt-1 truncate w-full text-slate-600 dark:text-slate-300">{f.name}</span>
                      </div>
                    );
                  })}
                  {activeCategory === 'fixture' && (
                    <button onClick={()=>symbolInputRef.current.click()} className="flex flex-col items-center justify-center p-2 rounded-lg border border-dashed border-slate-400 text-slate-500 dark:text-slate-400 h-[74px]">
                      <Plus className="w-6 h-6" /><span className="text-[10px]">심볼 추가</span>
                    </button>
                  )}
                </div>
              </div>
            </div>

            {/* CENTER PANEL */}
            <div className="flex-1 relative flex flex-col">
              
              <div className={`absolute top-4 left-1/2 -translate-x-1/2 flex items-center gap-1.5 bg-white/90 dark:bg-slate-800/90 backdrop-blur border border-slate-200 dark:border-slate-700 p-2 rounded-xl z-10 shadow-lg ${showUI ? 'flex' : 'hidden'}`}>
                <div className="flex bg-slate-100 dark:bg-slate-900 p-1 rounded-md">
                  <button onClick={undo} className="p-1 hover:bg-slate-200 dark:hover:bg-slate-700 rounded"><Undo className="w-4 h-4" /></button>
                  <button onClick={redo} className="p-1 hover:bg-slate-200 dark:hover:bg-slate-700 rounded"><Redo className="w-4 h-4" /></button>
                </div>
                <div className="w-px h-5 bg-slate-300"></div>
                <button onClick={()=>setIsDarkMode(!isDarkMode)} className="p-1.5 text-amber-500 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-md">{isDarkMode?<Sun className="w-4 h-4"/>:<Moon className="w-4 h-4"/>}</button>
                <button onClick={()=>setShowNewDocModal(true)} className="p-1.5 text-slate-500 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-md" title="새 문서"><LayoutTemplate className="w-4 h-4"/></button>
                <button onClick={handleSaveData} className="p-1.5 text-slate-500 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-md"><Save className="w-4 h-4"/></button>
                <button onClick={()=>fileInputRef.current.click()} className="p-1.5 text-slate-500 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-md"><Upload className="w-4 h-4"/></button>
                {!is3DView && <button onClick={()=>{setPdfExportMode(true); showToast("PDF 내보낼 영역을 드래그하세요");}} className={`p-1.5 rounded-md ${pdfExportMode?'bg-emerald-500 text-white':'text-slate-500 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700'}`}><Printer className="w-4 h-4"/></button>}
                {!is3DView && <button onClick={()=>imageInputRef.current.click()} className="p-1.5 text-slate-500 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-md" title="이미지 또는 PDF 도면 추가"><ImageIcon className="w-4 h-4"/></button>}
                <button onClick={()=>setShowEquipList(true)} className="p-1.5 text-slate-500 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-md" title="장비 리스트 (조명 종류/수량 자동 집계)"><ClipboardList className="w-4 h-4"/></button>
                <div className="w-px h-5 bg-slate-300"></div>
                <button onClick={()=>{setIs3DView(v=>!v); setSelectedIds([]); setPlacingFixture(null);}} className={`flex items-center gap-1 p-1.5 rounded-md font-bold text-xs ${is3DView?'bg-indigo-500 text-white':'text-slate-500 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700'}`} title="2D / 3D 보기 전환"><Box className="w-4 h-4"/> {is3DView ? '2D 보기' : '3D 보기'}</button>
                <div className="w-px h-5 bg-slate-300"></div>
                {!is3DView ? (
                  <>
                    <button onClick={()=>setActiveTool('select')} className={`p-1.5 rounded-md ${activeTool==='select'?'bg-indigo-500 text-white':'text-slate-500 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700'}`}><MousePointer2 className="w-4 h-4"/></button>
                    <button onClick={()=>setActiveTool('pan')} className={`p-1.5 rounded-md ${activeTool==='pan'?'bg-indigo-500 text-white':'text-slate-500 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700'}`}><Hand className="w-4 h-4"/></button>
                    <div className="w-px h-5 bg-slate-300"></div>
                    <button onClick={handleCenterView} className="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-md"><Target className="w-4 h-4" /></button>
                    <button onClick={()=>setView(v=>({...v, zoom:v.zoom*1.2}))} className="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-md"><ZoomIn className="w-4 h-4" /></button>
                    <span className="text-xs font-mono w-10 text-center">{Math.round(view.zoom*100)}%</span>
                    <button onClick={()=>setView(v=>({...v, zoom:v.zoom/1.2}))} className="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-md"><ZoomOut className="w-4 h-4" /></button>
                    <div className="w-px h-5 bg-slate-300"></div>
                    <label className="flex items-center gap-1 text-xs font-semibold cursor-pointer text-slate-600 dark:text-slate-300"><input type="checkbox" checked={snapToGrid} onChange={e=>setSnapToGrid(e.target.checked)} className="rounded" /> 스냅</label>
                    <label className="flex items-center gap-1 text-xs font-semibold cursor-pointer text-slate-600 dark:text-slate-300"><input type="checkbox" checked={showAxis} onChange={e=>setShowAxis(e.target.checked)} className="rounded" /> 기준선</label>
                  </>
                ) : (
                  <>
                    <button onClick={()=>setView3DKey(k=>k+1)} className="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-md" title="시점 초기화"><RotateCcw className="w-4 h-4" /></button>
                    <label className="flex items-center gap-1 text-xs font-semibold cursor-pointer text-slate-600 dark:text-slate-300"><input type="checkbox" checked={show3DBeams} onChange={e=>setShow3DBeams(e.target.checked)} className="rounded" /> 빛줄기 표시</label>
                    <span className="text-[10px] font-semibold text-slate-500 dark:text-slate-400">{placingFixture ? '바닥을 클릭해 배치하세요 (Esc 취소)' : '클릭: 선택 / 드래그: 회전 / 휠: 확대축소 / 우클릭드래그: 이동'}</span>
                  </>
                )}

                <input type="file" accept=".json" ref={fileInputRef} onChange={handleLoadData} className="hidden" />
                <input type="file" accept="image/*, application/pdf" ref={imageInputRef} onChange={handleImageUpload} className="hidden" />
                <input type="file" accept="image/*, .svg, application/pdf, .ai, .dwg, .dxf" ref={symbolInputRef} onChange={handleSymbolUpload} className="hidden" />
              </div>

              {toastMsg && <div className="absolute top-20 left-1/2 -translate-x-1/2 bg-indigo-600 text-white px-5 py-2 rounded-full text-sm font-bold shadow-lg z-50 animate-in fade-in">{toastMsg}</div>}

              {/* 컨텍스트 우클릭 팝업 메뉴 */}
              {contextMenu && (
                <div 
                  className="fixed z-[100] bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-2xl rounded-lg py-1.5 min-w-[160px] text-sm text-black dark:text-white font-bold" 
                  style={{ top: contextMenu.y, left: contextMenu.x }} 
                  onContextMenu={e => e.preventDefault()}
                  onPointerDown={e => { e.stopPropagation(); }}
                  onClick={e => { e.stopPropagation(); setContextMenu(null); }}
                >
                  {selectedIds.length > 0 ? (
                    <>
                      <button onClick={handleCopy} className="w-full text-left px-4 py-2 hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center gap-2"><Copy className="w-4 h-4"/> 복사</button>
                      <button onClick={handlePaste} disabled={clipboard.length === 0} className="w-full text-left px-4 py-2 hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center gap-2 disabled:opacity-50"><ClipboardPaste className="w-4 h-4"/> 붙여넣기</button>
                      <button onClick={handleDuplicate} className="w-full text-left px-4 py-2 hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center gap-2"><Files className="w-4 h-4"/> 복제</button>
                      <div className="h-px bg-slate-200 dark:bg-slate-700 my-1"></div>
                      <button onClick={handleGroup} disabled={selectedIds.length < 2} className="w-full text-left px-4 py-2 hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center gap-2 disabled:opacity-50"><Link className="w-4 h-4"/> 그룹 묶기</button>
                      <button onClick={handleUngroup} disabled={!fixtures.some(f => selectedIds.includes(f.id) && f.groupId)} className="w-full text-left px-4 py-2 hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center gap-2 disabled:opacity-50"><Unlink className="w-4 h-4"/> 그룹 풀기</button>
                      <div className="h-px bg-slate-200 dark:bg-slate-700 my-1"></div>
                      <button onClick={deleteSelectedFixtures} className="w-full text-left px-4 py-2 hover:bg-red-50 dark:hover:bg-red-900/30 text-red-600 dark:text-red-400 flex items-center gap-2"><Trash2 className="w-4 h-4"/> 삭제</button>
                    </>
                  ) : (
                    <>
                      <button onClick={handlePaste} disabled={clipboard.length === 0} className="w-full text-left px-4 py-2 hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center gap-2 disabled:opacity-50"><ClipboardPaste className="w-4 h-4"/> 붙여넣기</button>
                      <button onClick={handleSelectAll} disabled={fixtures.length === 0} className="w-full text-left px-4 py-2 hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center gap-2 disabled:opacity-50"><MousePointer2 className="w-4 h-4"/> 전체 선택</button>
                      <div className="h-px bg-slate-200 dark:bg-slate-700 my-1"></div>
                      <button onClick={undo} className="w-full text-left px-4 py-2 hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center gap-2"><Undo className="w-4 h-4"/> 실행 취소</button>
                      <button onClick={redo} className="w-full text-left px-4 py-2 hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center gap-2"><Redo className="w-4 h-4"/> 다시 실행</button>
                    </>
                  )}
                </div>
              )}

              {showEquipList && (
                <div className="fixed inset-0 bg-black/50 z-[200] flex items-center justify-center p-6" onPointerDown={e => e.stopPropagation()} onContextMenu={e => e.stopPropagation()}>
                  <div className="bg-white dark:bg-slate-800 rounded-xl shadow-2xl w-full max-w-2xl max-h-[85vh] flex flex-col overflow-hidden">
                    <div className="flex items-center justify-between p-4 border-b border-slate-200 dark:border-slate-700">
                      <h2 className="text-base font-bold flex items-center gap-2 text-black dark:text-white"><ClipboardList className="w-5 h-5 text-indigo-600 dark:text-indigo-400" /> 장비 리스트 (조명 종류/수량)</h2>
                      <button onClick={() => setShowEquipList(false)} className="p-1 hover:bg-slate-100 dark:hover:bg-slate-700 rounded"><X className="w-5 h-5 text-black dark:text-white" /></button>
                    </div>
                    <div className="flex-1 overflow-y-auto custom-scrollbar p-4 bg-slate-100 dark:bg-slate-900">
                      <div ref={equipListRef} className="bg-white p-6 text-black">
                        <div className="mb-4 border-b-2 border-slate-800 pb-3">
                          <div className="text-lg font-bold">{showInfo.production || '무제 공연'} — 조명 장비 리스트</div>
                          <div className="text-xs text-slate-500 mt-1 flex flex-wrap gap-x-4">
                            <span>공연장: {showInfo.venue || '-'}</span>
                            <span>조명디자이너: {showInfo.lightingDesigner || '-'}</span>
                            <span>작성일: {new Date().toISOString().slice(0, 10)}</span>
                          </div>
                        </div>
                        <table className="w-full text-sm border-collapse">
                          <thead>
                            <tr className="border-b-2 border-slate-800">
                              <th className="text-left py-2 px-2 w-12">No.</th>
                              <th className="text-left py-2 px-2 w-16">심볼</th>
                              <th className="text-left py-2 px-2">품명 (조명 종류)</th>
                              <th className="text-left py-2 px-2">라이브러리</th>
                              <th className="text-right py-2 px-2 w-20">수량</th>
                              <th className="text-right py-2 px-2 w-24">단일 용량</th>
                              <th className="text-right py-2 px-2 w-24">용량 합계</th>
                            </tr>
                          </thead>
                          <tbody>
                            {equipmentList.map((item, i) => (
                              <tr key={item.key} className="border-b border-slate-200">
                                <td className="py-2 px-2">{i + 1}</td>
                                <td className="py-2 px-2"><div className="w-10 h-10 flex items-center justify-center">{item.render('#334155', 40, 0, 2, 40, '', item.src)}</div></td>
                                <td className="py-2 px-2 font-semibold">{item.name}</td>
                                <td className="py-2 px-2">{item.library || '-'}</td>
                                <td className="py-2 px-2 text-right font-bold">{item.count}</td>
                                <td className="py-2 px-2 text-right">{item.totalWattage > 0 ? `${Number((item.totalWattage / item.count).toFixed(1))}W` : '-'}</td>
                                <td className="py-2 px-2 text-right">{item.totalWattage > 0 ? `${item.totalWattage}W` : '-'}</td>
                              </tr>
                            ))}
                            {equipmentList.length === 0 && (
                              <tr><td colSpan="7" className="py-8 text-center text-slate-400">배치된 조명 기구가 없습니다.</td></tr>
                            )}
                          </tbody>
                          {equipmentList.length > 0 && (
                            <tfoot>
                              <tr className="border-t-2 border-slate-800 font-bold">
                                <td colSpan="4" className="py-2 px-2 text-right">총 수량 / 총 용량</td>
                                <td className="py-2 px-2 text-right">{equipmentList.reduce((s, it) => s + it.count, 0)}</td>
                                <td className="py-2 px-2"></td>
                                <td className="py-2 px-2 text-right">{equipmentList.reduce((s, it) => s + it.totalWattage, 0)}W</td>
                              </tr>
                            </tfoot>
                          )}
                        </table>
                      </div>
                    </div>
                    <div className="p-4 border-t border-slate-200 dark:border-slate-700 flex justify-end gap-2">
                      <button onClick={() => setShowEquipList(false)} className="px-4 py-2 rounded-md text-sm font-bold bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-600">닫기</button>
                      <button onClick={handleDownloadEquipListPDF} disabled={equipmentList.length === 0} className="px-4 py-2 rounded-md text-sm font-bold bg-indigo-600 text-white hover:bg-indigo-700 flex items-center gap-1.5 disabled:opacity-50"><FileText className="w-4 h-4" /> PDF 다운로드</button>
                    </div>
                  </div>
                </div>
              )}

              {is3DView && (
                <ThreeDView
                  key={view3DKey}
                  fixtures={fixtures} layers={layers} isDarkMode={isDarkMode} showBeams={show3DBeams}
                  selectedIds={selectedIds} placingFixture={placingFixture}
                  onPlaceAt={placeFixtureAt} onSelectFixture={selectFixtureFrom3D} onDeselect={deselectAll3D}
                />
              )}

              <div
                ref={containerRef}
                className={`flex-1 overflow-hidden relative ${is3DView ? 'hidden' : ''} ${pdfExportMode||placingFixture?'cursor-crosshair':activeTool==='pan'?(isPanning?'cursor-grabbing':'cursor-grab'):'cursor-default'}`}
                onWheel={handleWheel}
                onContextMenu={(e) => { e.preventDefault(); setContextMenu({ x: e.clientX, y: e.clientY }); }}
                onPointerDown={handlePointerDown} onPointerMove={handlePointerMove} onPointerUp={handlePointerUp} onPointerLeave={handlePointerUp}
                style={{ backgroundImage: `linear-gradient(to right, ${themeVars.grid} 1px, transparent 1px), linear-gradient(to bottom, ${themeVars.grid} 1px, transparent 1px)`, backgroundSize: `${50*view.zoom}px ${50*view.zoom}px`, backgroundPosition: `${view.x}px ${view.y}px` }}
              >
                {selectionBox && !pdfExportMode && <div className="absolute border border-indigo-400 bg-indigo-500/20 pointer-events-none z-40" style={{ left: Math.min(selectionBox.startX, selectionBox.currX), top: Math.min(selectionBox.startY, selectionBox.currY), width: Math.abs(selectionBox.currX - selectionBox.startX), height: Math.abs(selectionBox.currY - selectionBox.startY) }} />}
                {pdfExportMode && exportBox && <div className="absolute border-2 border-emerald-400 bg-emerald-500/10 border-dashed pointer-events-none z-40" style={{ left: Math.min(exportBox.startX, exportBox.currX), top: Math.min(exportBox.startY, exportBox.currY), width: Math.abs(exportBox.currX - exportBox.startX), height: Math.abs(exportBox.currY - exportBox.startY) }}><div className="absolute top-2 left-2 bg-emerald-500 text-white text-[10px] px-1 py-0.5 rounded font-bold">A4 비율</div></div>}

                <div className="absolute inset-0 pointer-events-none" style={{ transform: `translate(${view.x}px, ${view.y}px) scale(${view.zoom})`, transformOrigin: '0 0' }}>

                  {pageSize && (
                    <div
                      className="absolute"
                      style={{
                        left: -pageSize.widthUnits / 2, top: -pageSize.heightUnits / 2,
                        width: pageSize.widthUnits, height: pageSize.heightUnits,
                        background: isDarkMode ? '#1e293b' : '#ffffff',
                        boxShadow: '0 0 0 1px rgba(100,116,139,0.4), 0 8px 24px rgba(0,0,0,0.25)',
                        zIndex: -10
                      }}
                    >
                      <span className="absolute -top-5 left-0 text-[10px] font-bold whitespace-nowrap" style={{ color: themeVars.dimText }}>{pageSize.label}</span>
                    </div>
                  )}

                  {showAxis && (() => {
                    // 새로 만들기(도면 바탕)로 생성된 문서가 있으면 눈금자를 용지 바깥으로 밀어내어 항상 용지 밖에서 보이게 함
                    const rulerHalfW = pageSize ? Math.ceil((pageSize.widthUnits / 2) / 50) * 50 : 400;
                    const rulerHalfH = pageSize ? Math.ceil((pageSize.heightUnits / 2) / 50) * 50 : 400;
                    const hBaselineY = -rulerHalfH - 20;
                    const vBaselineX = rulerHalfW + 20;
                    const hCount = rulerHalfW / 50, vCount = rulerHalfH / 50;
                    const hVals = Array.from({ length: hCount * 2 + 1 }, (_, i) => i - hCount);
                    const vVals = Array.from({ length: vCount * 2 + 1 }, (_, i) => i - vCount);
                    const svgHalfExtent = Math.max(rulerHalfW, rulerHalfH) + 600;
                    return (
                      <svg className="absolute pointer-events-none" style={{ left: -svgHalfExtent, top: -svgHalfExtent, zIndex: -1 }} width={svgHalfExtent * 2} height={svgHalfExtent * 2} viewBox={`${-svgHalfExtent} ${-svgHalfExtent} ${svgHalfExtent * 2} ${svgHalfExtent * 2}`}>
                        <line x1={-rulerHalfW} y1={hBaselineY} x2={rulerHalfW} y2={hBaselineY} stroke={themeVars.dimLine} strokeWidth="1.5" />
                        {hVals.map(v => (
                          <g key={`w-tick-${v}`}>
                            <line x1={v * 50} y1={hBaselineY} x2={v * 50} y2={v === 0 ? hBaselineY - 12 : hBaselineY - 6} stroke={themeVars.dimLine} strokeWidth="1.5" />
                            <text x={v * 50} y={v === 0 ? hBaselineY - 16 : hBaselineY - 10} fill={v === 0 ? themeVars.dimTextZero : themeVars.dimText} fontSize="10" fontWeight="bold" textAnchor="middle">{v === 0 ? 'CL (0m)' : `${v}m`}</text>
                          </g>
                        ))}
                        <line x1={vBaselineX} y1={-rulerHalfH} x2={vBaselineX} y2={rulerHalfH} stroke={themeVars.dimLine} strokeWidth="1.5" />
                        {vVals.map(v => (
                          <g key={`d-tick-${v}`}>
                            <line x1={vBaselineX} y1={v * 50} x2={v === 0 ? vBaselineX + 12 : vBaselineX + 6} y2={v * 50} stroke={themeVars.dimLine} strokeWidth="1.5" />
                            <text x={v === 0 ? vBaselineX + 16 : vBaselineX + 10} y={v * 50 + 3} fill={v === 0 ? themeVars.dimTextZero : themeVars.dimText} fontSize="10" fontWeight="bold">{v === 0 ? 'PL (0m)' : `${-v}m`}</text>
                          </g>
                        ))}
                        <line x1="0" y1={-svgHalfExtent + 200} x2="0" y2={svgHalfExtent - 200} stroke="#ef4444" strokeWidth="1.5" strokeDasharray="10 10" opacity="0.5" />
                        <line x1={-svgHalfExtent + 200} y1="0" x2={svgHalfExtent - 200} y2="0" stroke="#ef4444" strokeWidth="1.5" strokeDasharray="10 10" opacity="0.5" />
                      </svg>
                    );
                  })()}

                  {[...fixtures].sort((a,b)=>getSortOrder(a.type) - getSortOrder(b.type))
                  .filter(f=>layers.find(l=>l.id===(f.layerId||'layer_default'))?.visible !== false).map(f => {
                    const isSel = selectedIds.includes(f.id);
                    const tInf = FIXTURE_TYPES[f.type];
                    if (!tInf) return null;
                    const isLock = layers.find(l=>l.id===(f.layerId||'layer_default'))?.locked;
                    const cColor = isSel ? themeVars.fixtureSelected : (f.color || themeVars.fixtureNormal);
                    
                    return (
                      <div key={f.id} className={`absolute pointer-events-auto ${isSel?'z-20':'z-10'} ${isLock?'cursor-not-allowed opacity-60':'cursor-move fixture-node'}`} style={{ left: f.x, top: f.y, transform: `translate(-50%, -50%)` }} onPointerDown={e=>handleFixturePointerDown(e, f)}>
                        <div className={`relative ${isSel?'drop-shadow-[0_0_8px_rgba(99,102,241,0.8)]':''}`} style={{ transform: `rotate(${f.rotation}deg) scale(${f.scale||1})`, transformOrigin: 'center' }}>
                          {tInf.render(cColor, f.width||100, f.rotation, f.thickness||2, f.height||100, f.text||f.name, f.src, f.bgColor, f.opacity, f.dash, f.rx)}
                          
                          {isSel && !isLock && (
                            <div className="absolute inset-0 pointer-events-none">
                              {tInf.category === 'fixture' ? (
                                <div className="absolute bg-white border-2 border-indigo-600 rounded-sm cursor-se-resize pointer-events-auto hover:bg-indigo-100" style={{ bottom: '0px', right: '0px', transform: 'translate(50%, 50%)', width: '12px', height: '12px', zIndex: 30 }} onPointerDown={e=>handleResizePointerDown(e, f, 'se')} />
                              ) : (
                                <>
                                  <div className="absolute bg-white border-2 border-indigo-600 rounded-sm cursor-e-resize pointer-events-auto hover:bg-indigo-100" style={{ top: '50%', right: '0px', transform: 'translate(50%, -50%)', width: '10px', height: '10px', zIndex: 30 }} onPointerDown={e=>handleResizePointerDown(e, f, 'e')} />
                                  {['STAGE_PROSCENIUM', 'STAGE_THRUST', 'STAGE_ARENA', 'STAGE_BLACKBOX', 'RECTANGLE', 'CIRCLE', 'CURVE', 'IMAGE', 'LABEL', 'TEXT'].includes(f.type) && (
                                    <>
                                      <div className="absolute bg-white border-2 border-indigo-600 rounded-sm cursor-s-resize pointer-events-auto hover:bg-indigo-100" style={{ left: '50%', bottom: '0px', transform: 'translate(-50%, 50%)', width: '10px', height: '10px', zIndex: 30 }} onPointerDown={e=>handleResizePointerDown(e, f, 's')} />
                                      <div className="absolute bg-white border-2 border-indigo-600 rounded-sm cursor-se-resize pointer-events-auto hover:bg-indigo-100" style={{ bottom: '0px', right: '0px', transform: 'translate(50%, 50%)', width: '12px', height: '12px', zIndex: 30 }} onPointerDown={e=>handleResizePointerDown(e, f, 'se')} />
                                    </>
                                  )}
                                </>
                              )}
                            </div>
                          )}
                        </div>
                        
                        <div className="absolute top-full left-1/2 -translate-x-1/2 mt-1 text-center pointer-events-none">
                          {tInf.category === 'fixture' && f.name && f.name !== tInf.name && <div className="text-[9px] font-bold text-indigo-600">{f.name}</div>}
                          {f.channel && tInf.category === 'fixture' && <div className="text-[10px] font-bold text-indigo-500">{f.channel}</div>}
                        </div>
                        
                        {isSel && (
                          <div className="rotate-handle absolute left-1/2 w-8 h-8 -translate-x-1/2 flex items-center justify-center cursor-crosshair pointer-events-auto" onPointerDown={e=>handleRotatePointerDown(e, f)} style={{ top: `${-30 - 20 * ((f.scale||1)-1)}px` }}>
                            <div className="w-3.5 h-3.5 bg-indigo-400 rounded-full border-[2px] border-white z-10" />
                          </div>
                        )}
                      </div>
                    );
                  })}
                  
                  {placingFixture && hoverPos && FIXTURE_TYPES[placingFixture.startsWith('csym_') ? 'CUSTOM_SYMBOL' : placingFixture] && (
                    <div className="absolute pointer-events-none z-30" style={{ left: hoverPos.x, top: hoverPos.y, transform: `translate(-50%, -50%)` }}>
                      <div className="absolute top-1/2 left-[-4000px] w-[8000px] h-px bg-indigo-500/60 border-t border-dashed border-indigo-500"></div>
                      <div className="absolute left-1/2 top-[-4000px] w-px h-[8000px] bg-indigo-500/60 border-l border-dashed border-indigo-500"></div>
                      <div className="opacity-60 drop-shadow-md">
                        {(() => {
                          const t = FIXTURE_TYPES[placingFixture.startsWith('csym_') ? 'CUSTOM_SYMBOL' : placingFixture];
                          return t.render('#a5b4fc', ['shape','memo','image'].includes(t.category)?150:(t.category==='venue'?500:300), 0, 2, ['shape','image'].includes(t.category)?100:(t.category==='venue'?400:(t.category==='memo'?50:undefined)), t.name);
                        })()}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>

            {/* RIGHT PANEL (Properties) */}
            <div className={`w-52 bg-white dark:bg-slate-800 border-l border-slate-200 dark:border-slate-700 flex-col z-10 shadow-xl overflow-hidden selection:bg-black selection:text-white ${showUI ? 'flex' : 'hidden'}`}>
              <div className="p-4 bg-slate-100 dark:bg-slate-900 border-b dark:border-slate-700">
                <div className="flex justify-between items-center mb-2">
                  <h2 className="text-sm font-bold flex items-center gap-2 text-black dark:text-white"><Settings2 className="w-4 h-4" /> 기구 속성</h2>
                  {selectedIds.length > 0 && <button onClick={deleteSelectedFixtures} className="p-1 text-red-500 hover:bg-red-100 rounded"><Trash2 className="w-4 h-4" /></button>}
                </div>
                
                <div className="flex gap-1 mb-1 mt-3">
                  <button onClick={handleCopy} disabled={selectedIds.length === 0} className="flex-1 flex items-center justify-center gap-0.5 py-1 px-1 text-[10px] font-bold text-black dark:text-white bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded hover:bg-slate-50 dark:hover:bg-slate-700 disabled:opacity-30 transition-colors">
                    <Copy className="w-3 h-3" /> 복사
                  </button>
                  <button onClick={handlePaste} disabled={clipboard.length === 0} className="flex-1 flex items-center justify-center gap-0.5 py-1 px-1 text-[10px] font-bold text-black dark:text-white bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded hover:bg-slate-50 dark:hover:bg-slate-700 disabled:opacity-30 transition-colors">
                    <ClipboardPaste className="w-3 h-3" /> 붙여넣기
                  </button>
                  <button onClick={handleDuplicate} disabled={selectedIds.length === 0} className="flex-1 flex items-center justify-center gap-0.5 py-1 px-1 text-[10px] font-bold text-black dark:text-white bg-indigo-50 dark:bg-indigo-900/30 border border-indigo-200 dark:border-indigo-800 rounded hover:bg-indigo-100 disabled:opacity-30 transition-colors">
                    <Files className="w-3 h-3" /> 복제
                  </button>
                </div>
                <div className="flex gap-1">
                  <button onClick={handleGroup} disabled={selectedIds.length < 2} className="flex-1 flex items-center justify-center gap-0.5 py-1 px-1 text-[10px] font-bold text-black dark:text-white bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded hover:bg-slate-50 dark:hover:bg-slate-700 disabled:opacity-30 transition-colors">
                    <Link className="w-3 h-3" /> 그룹 묶기
                  </button>
                  <button onClick={handleUngroup} disabled={!fixtures.some(f => selectedIds.includes(f.id) && f.groupId)} className="flex-1 flex items-center justify-center gap-0.5 py-1 px-1 text-[10px] font-bold text-black dark:text-white bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded hover:bg-slate-50 dark:hover:bg-slate-700 disabled:opacity-30 transition-colors">
                    <Unlink className="w-3 h-3" /> 그룹 풀기
                  </button>
                </div>
              </div>

              <div className="p-4 flex-1 overflow-y-auto custom-scrollbar text-black dark:text-white font-bold">
                {selectedIds.length > 1 ? (
                  <div className="space-y-4">
                    <div className="bg-indigo-50 p-3 rounded text-center"><span className="text-indigo-600 font-bold">{selectedIds.length}개</span> <span className="text-black font-bold">선택됨</span></div>
                    <p className="text-xs text-black dark:text-white font-bold">아래 속성을 변경하면 선택된 객체들에 일괄 적용됩니다.</p>

                    <div><label className="text-xs font-bold text-black dark:text-white mb-1 block">일괄 색상 변경</label>
                      <div className="flex gap-1"><input type="color" onChange={e=>updateSelectedFixtures('color', e.target.value)} className="w-9 h-9 p-0.5" /><input type="text" onChange={e=>updateSelectedFixtures('color', e.target.value)} className="flex-1 border rounded p-2 text-sm text-black font-bold" placeholder="ex) #ff0000" /></div>
                    </div>
                    <div><label className="text-xs font-bold text-black dark:text-white mb-1 block">일괄 배경색 (BgColor)</label>
                      <div className="flex gap-1"><input type="color" onChange={e=>updateSelectedFixtures('bgColor', e.target.value)} className="w-9 h-9 p-0.5" /><button onClick={()=>updateSelectedFixtures('bgColor', '')} className="flex-1 border rounded text-xs bg-white text-black font-bold">투명 적용</button></div>
                    </div>
                    <div><label className="text-xs font-bold text-black dark:text-white mb-1 block">일괄 투명도 (Opacity)</label><input type="range" min="0.1" max="1" step="0.1" onChange={e=>updateSelectedFixtures('opacity', parseFloat(e.target.value))} className="w-full" /></div>
                    <div><label className="text-xs font-bold text-black dark:text-white mb-1 block">일괄 외곽선 굵기 (Thickness)</label><input type="range" min="0.5" max="20" step="0.5" onChange={e=>updateSelectedFixtures('thickness', parseFloat(e.target.value))} className="w-full" /></div>
                    <div><label className="text-xs font-bold text-black dark:text-white mb-1 block">일괄 설치 높이 (3D, Height)</label><input type="range" min="0" max="15" step="0.1" onChange={e=>updateSelectedFixtures('zHeight', parseFloat(e.target.value))} className="w-full" /></div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-xs font-bold text-black dark:text-white mb-1 block">일괄 외곽선 형태</label>
                        <select onChange={e=>updateSelectedFixtures('dash', e.target.value === 'solid' ? '' : e.target.value)} className="w-full border rounded p-1.5 text-xs bg-white text-black font-bold" defaultValue="none">
                          <option value="none" disabled>선택...</option>
                          <option value="solid">실선 (Solid)</option>
                          <option value="8 8">파선 (Dashed)</option>
                          <option value="2 4">점선 (Dotted)</option>
                          <option value="12 4 2 4">일점쇄선 (Dash-Dot)</option>
                        </select>
                      </div>
                      <div>
                        <label className="text-xs font-bold text-black dark:text-white mb-1 block">일괄 모서리 둥글기</label>
                        <input type="range" min="0" max="100" step="1" onChange={e=>updateSelectedFixtures('rx', parseFloat(e.target.value))} className="w-full" />
                      </div>
                    </div>

                    <div><label className="text-xs font-bold text-black dark:text-white mb-1 block">일괄 레이어 변경</label><select onChange={e=>updateSelectedFixtures('layerId', e.target.value)} className="w-full border rounded p-2 text-sm bg-white text-black font-bold" defaultValue=""><option value="" disabled>선택...</option>{layers.map(l=><option key={l.id} value={l.id}>{l.name}</option>)}</select></div>

                    {(() => {
                      const fixtureCount = fixtures.filter(f => selectedIds.includes(f.id) && FIXTURE_TYPES[f.type]?.category === 'fixture').length;
                      return fixtureCount > 0 && (
                        <div className="border-t pt-3">
                          <label className="text-xs font-bold text-black dark:text-white mb-1 block">포트/채널 자동 배정 ({fixtureCount}개, 왼쪽→오른쪽 순)</label>
                          <div className="grid grid-cols-3 gap-1 mb-2">
                            <div><span className="text-[10px] text-black dark:text-white font-bold block mb-0.5">포트(고정)</span><input type="text" value={autoChannelPort} onChange={e=>setAutoChannelPort(e.target.value)} placeholder="비우면 유지" className="w-full border rounded p-1.5 text-xs bg-white text-black font-bold" /></div>
                            <div><span className="text-[10px] text-black dark:text-white font-bold block mb-0.5">시작 채널</span><input type="number" value={autoChannelStart} onChange={e=>setAutoChannelStart(e.target.value)} className="w-full border rounded p-1.5 text-xs bg-white text-black font-bold" /></div>
                            <div><span className="text-[10px] text-black dark:text-white font-bold block mb-0.5">간격</span><input type="number" value={autoChannelStep} onChange={e=>setAutoChannelStep(e.target.value)} className="w-full border rounded p-1.5 text-xs bg-white text-black font-bold" /></div>
                          </div>
                          <button onClick={handleAutoAssignChannel} className="w-full py-1.5 rounded-md text-xs font-bold bg-indigo-600 text-white hover:bg-indigo-700">채널 자동 배정 적용</button>
                        </div>
                      );
                    })()}
                  </div>
                ) : selectedIds.length === 1 && firstSel && typeInfo ? (
                  <div className="space-y-4">
                    <div className="bg-slate-50 p-3 rounded-lg border flex items-center gap-3">
                      <div className="flex-1 min-w-0">
                        <div className="w-full text-sm font-bold text-black truncate">{customSymbolNames[firstSel.customSymbolId||firstSel.type] || firstSel.name}</div>
                        <div className="text-[10px] text-black font-bold mt-0.5">ID: {firstSel.id.split('_')[1]}</div>
                      </div>
                    </div>

                    {typeInfo.category === 'memo' && (
                      <div><label className="text-xs font-bold text-black dark:text-white mb-1 block">메모 내용 (Text)</label><textarea value={firstSel.text||''} onChange={e=>updateSelectedFixtures('text', e.target.value)} className="w-full h-20 border rounded p-2 text-sm bg-white text-black font-bold" /></div>
                    )}
                    {typeInfo.category !== 'memo' && (
                      <div><label className="text-xs font-bold text-black dark:text-white mb-1 block">이름 (Name)</label><input type="text" value={firstSel.name||''} onChange={e=>updateSelectedFixtures('name', e.target.value)} className="w-full border rounded p-2 text-sm bg-white text-black font-bold" /></div>
                    )}

                    {typeInfo.category === 'fixture' && (
                      <div className="grid grid-cols-2 gap-2">
                        <div><label className="text-xs font-bold text-black dark:text-white mb-1 block">라이브러리 (Library)</label><input type="text" value={firstSel.library||''} onChange={e=>updateSelectedFixtures('library', e.target.value)} className="w-full border rounded p-2 text-sm bg-white text-black font-bold" placeholder="ex) ETC S4" /></div>
                        <div><label className="text-xs font-bold text-black dark:text-white mb-1 block">용량 (Watt)</label><input type="text" value={firstSel.wattage||''} onChange={e=>updateSelectedFixtures('wattage', e.target.value)} className="w-full border rounded p-2 text-sm bg-white text-black font-bold" placeholder="ex) 750W" /></div>
                      </div>
                    )}

                    {['venue', 'structure', 'shape', 'memo', 'image'].includes(typeInfo.category) && (
                      <>
                        <div>
                          <label className="flex justify-between text-xs font-bold text-black dark:text-white mb-1"><span>가로/길이 (Width)</span></label>
                          <div className="flex gap-2">
                            <input type="range" min="0.5" max="40" step={snapToGrid?"1":"0.1"} value={firstSel.width/50} onChange={e=>updateSelectedFixtures('width', parseFloat(e.target.value)*50)} className="flex-1" />
                            <div className="flex items-center border rounded px-1 w-16 bg-white"><input type="number" value={Number((firstSel.width/50).toFixed(1))} onChange={e=>updateSelectedFixtures('width', parseFloat(e.target.value)*50)} className="w-full text-xs text-right outline-none text-black font-bold" /><span className="text-[10px] text-black font-bold">m</span></div>
                          </div>
                        </div>
                        {['STAGE_PROSCENIUM', 'STAGE_THRUST', 'STAGE_ARENA', 'STAGE_BLACKBOX', 'RECTANGLE', 'CIRCLE', 'CURVE', 'LABEL', 'IMAGE'].includes(firstSel.type) && (
                          <div>
                            <label className="flex justify-between text-xs font-bold text-black dark:text-white mb-1"><span>세로 (Height)</span></label>
                            <div className="flex gap-2">
                              <input type="range" min="0.5" max="40" step={snapToGrid?"1":"0.1"} value={(firstSel.height||100)/50} onChange={e=>updateSelectedFixtures('height', parseFloat(e.target.value)*50)} className="flex-1" />
                              <div className="flex items-center border rounded px-1 w-16 bg-white"><input type="number" value={Number(((firstSel.height||100)/50).toFixed(1))} onChange={e=>updateSelectedFixtures('height', parseFloat(e.target.value)*50)} className="w-full text-xs text-right outline-none text-black font-bold" /><span className="text-[10px] text-black font-bold">m</span></div>
                            </div>
                          </div>
                        )}
                      </>
                    )}

                    <div>
                      <label className="flex justify-between text-xs font-bold text-black dark:text-white mb-1"><span>비율 크기 (Scale)</span><span>{(firstSel.scale||1).toFixed(1)}x</span></label>
                      <input type="range" min="0.1" max="10" step="0.1" value={firstSel.scale||1} onChange={e=>updateSelectedFixtures('scale', parseFloat(e.target.value))} className="w-full" />
                    </div>

                    <div className="flex gap-2">
                      <div className="flex-1"><label className="text-xs text-black dark:text-white font-bold mb-1 block">배경색 (BgColor)</label><div className="flex gap-1"><input type="color" value={firstSel.bgColor||'#ffffff'} onChange={e=>updateSelectedFixtures('bgColor', e.target.value)} className="w-8 h-8 p-0" /><button onClick={()=>updateSelectedFixtures('bgColor', '')} className="flex-1 border rounded text-[10px] bg-slate-50 text-black font-bold">투명</button></div></div>
                      <div className="flex-1"><label className="text-xs text-black dark:text-white font-bold mb-1 block">선색상 (Color)</label><input type="color" value={(firstSel.color&&/^#[0-9A-F]{6}$/i.test(firstSel.color))?firstSel.color:'#ffffff'} onChange={e=>updateSelectedFixtures('color', e.target.value)} className="w-full h-8 p-0" /></div>
                    </div>

                    <div>
                      <label className="flex justify-between text-xs font-bold text-black dark:text-white mb-1"><span>투명도 (Opacity)</span><span>{Math.round((firstSel.opacity||1)*100)}%</span></label>
                      <input type="range" min="0.1" max="1" step="0.1" value={firstSel.opacity||1} onChange={e=>updateSelectedFixtures('opacity', parseFloat(e.target.value))} className="w-full" />
                    </div>

                    <div>
                      <label className="flex justify-between text-xs font-bold text-black dark:text-white mb-1"><span>외곽선 굵기 (Thickness)</span><span>{firstSel.thickness || 2}px</span></label>
                      <input type="range" min="0.5" max="20" step="0.5" value={firstSel.thickness || 2} onChange={e=>updateSelectedFixtures('thickness', parseFloat(e.target.value))} className="w-full" />
                    </div>

                    <div className="grid grid-cols-2 gap-2 border-t pt-3 mt-1">
                      <div>
                        <label className="text-xs text-black dark:text-white font-bold mb-1 block">외곽선 형태 (Dash)</label>
                        <select value={firstSel.dash || ''} onChange={e=>updateSelectedFixtures('dash', e.target.value)} className="w-full border rounded p-1.5 text-xs bg-white text-black font-bold">
                          <option value="">실선 (Solid)</option>
                          <option value="8 8">파선 (Dashed)</option>
                          <option value="2 4">점선 (Dotted)</option>
                          <option value="12 4 2 4">일점쇄선 (Dash-Dot)</option>
                        </select>
                      </div>
                      <div>
                        <label className="flex justify-between text-xs text-black dark:text-white font-bold mb-1"><span>모서리 둥글기</span><span>{firstSel.rx || 0}px</span></label>
                        <input type="range" min="0" max="100" step="1" value={firstSel.rx || 0} onChange={e=>updateSelectedFixtures('rx', parseFloat(e.target.value))} className="w-full" />
                      </div>
                    </div>

                    {['fixture', 'structure'].includes(typeInfo.category) && (
                      <div className="border-t pt-3">
                        <label className="flex justify-between text-xs font-bold text-black dark:text-white mb-1"><span>설치 높이 (3D, Height)</span><span>{(firstSel.zHeight != null ? firstSel.zHeight : RIG_HEIGHT).toFixed(1)}m</span></label>
                        <input type="range" min="0" max="15" step="0.1" value={firstSel.zHeight != null ? firstSel.zHeight : RIG_HEIGHT} onChange={e=>updateSelectedFixtures('zHeight', parseFloat(e.target.value))} className="w-full" />
                      </div>
                    )}

                    {typeInfo.category === 'fixture' && (
                      <div className="grid grid-cols-2 gap-2 border-t pt-3">
                        <div><label className="text-xs text-black dark:text-white font-bold mb-1 block">포트/채널</label><input type="text" value={firstSel.channel} onChange={e=>updateSelectedFixtures('channel', e.target.value)} className="w-full border rounded p-1.5 text-xs bg-white text-black font-bold" placeholder="ex) 1/24" /></div>
                        <div><label className="text-xs text-black dark:text-white font-bold mb-1 block">디머</label><input type="text" value={firstSel.dimmer} onChange={e=>updateSelectedFixtures('dimmer', e.target.value)} className="w-full border rounded p-1.5 text-xs bg-white text-black font-bold" placeholder="ex) A/1" /></div>
                      </div>
                    )}
                    
                    <div className="grid grid-cols-2 gap-2 border-t pt-3">
                       <div className="bg-slate-50 p-2 rounded text-center border"><span className="text-[10px] text-black font-bold block">X 좌표</span><span className="text-xs font-mono text-black font-bold">{(firstSel.x/50).toFixed(2)}m</span></div>
                       <div className="bg-slate-50 p-2 rounded text-center border"><span className="text-[10px] text-black font-bold block">Y 좌표</span><span className="text-xs font-mono text-black font-bold">{(firstSel.y/50).toFixed(2)}m</span></div>
                    </div>

                  </div>
                ) : (
                  <div className="h-full flex flex-col items-center justify-center text-black dark:text-white font-bold">
                    <MousePointer2 className="w-10 h-10 opacity-50 mb-2" />
                    <p className="text-sm text-center">캔버스에서 객체를<br/>선택해 편집하세요.</p>
                  </div>
                )}
              </div>
            </div>

          </div>

          {/* 새 문서 만들기 모달 (Adobe Illustrator 스타일) */}
          {showNewDocModal && (() => {
            const preview = computePageSize(newDocSetting);
            const presetCard = (key) => {
              const isSel = !newDocSetting.useCustom && newDocSetting.preset === key;
              const dims = PAPER_SIZES_MM[key];
              const ratio = dims.w / dims.h;
              return (
                <button
                  key={key}
                  onClick={() => setNewDocSetting(s => ({ ...s, preset: key, useCustom: false }))}
                  className={`flex-1 flex flex-col items-center gap-2 p-3 rounded-lg border-2 transition-colors ${isSel ? 'border-indigo-500 bg-indigo-50 dark:bg-indigo-900/30' : 'border-slate-200 dark:border-slate-700 hover:border-slate-300 dark:hover:border-slate-600'}`}
                >
                  <div className="h-12 flex items-center justify-center">
                    <div className="bg-white border border-slate-400 shadow-sm" style={{ width: 34 * ratio, height: 34 }} />
                  </div>
                  <span className={`text-xs font-bold ${isSel ? 'text-indigo-600' : 'text-slate-600 dark:text-slate-300'}`}>{key}</span>
                </button>
              );
            };
            const orientBtn = (key, label, wide) => {
              const isSel = !newDocSetting.useCustom && newDocSetting.orientation === key;
              return (
                <button
                  onClick={() => setNewDocSetting(s => ({ ...s, orientation: key, useCustom: false }))}
                  className={`flex-1 flex flex-col items-center gap-2 p-3 rounded-lg border-2 transition-colors ${isSel ? 'border-indigo-500 bg-indigo-50 dark:bg-indigo-900/30' : 'border-slate-200 dark:border-slate-700 hover:border-slate-300 dark:hover:border-slate-600'}`}
                >
                  <div className="h-8 flex items-center justify-center">
                    <div className="bg-white border border-slate-400 shadow-sm" style={{ width: wide ? 30 : 20, height: wide ? 20 : 30 }} />
                  </div>
                  <span className={`text-xs font-bold ${isSel ? 'text-indigo-600' : 'text-slate-600 dark:text-slate-300'}`}>{label}</span>
                </button>
              );
            };
            return (
              <div className="fixed inset-0 bg-black/50 z-[200] flex items-center justify-center" onPointerDown={() => setShowNewDocModal(false)}>
                <div className="bg-white dark:bg-slate-800 rounded-xl shadow-2xl w-[440px] p-6 text-black dark:text-white" onPointerDown={e => e.stopPropagation()}>
                  <div className="flex justify-between items-center mb-5">
                    <h2 className="text-base font-bold flex items-center gap-2"><LayoutTemplate className="w-5 h-5 text-indigo-500" /> 새 문서 만들기</h2>
                    <button onClick={() => setShowNewDocModal(false)} className="p-1 hover:bg-slate-100 dark:hover:bg-slate-700 rounded"><X className="w-4 h-4" /></button>
                  </div>

                  <div className="mb-4">
                    <label className="text-xs font-bold text-slate-500 dark:text-slate-400 block mb-2">용지 크기</label>
                    <div className="flex gap-2">{['A4', 'A3'].map(presetCard)}</div>
                  </div>

                  <div className="mb-4">
                    <label className="text-xs font-bold text-slate-500 dark:text-slate-400 block mb-2">방향</label>
                    <div className="flex gap-2">
                      {orientBtn('landscape', '가로', true)}
                      {orientBtn('portrait', '세로', false)}
                    </div>
                  </div>

                  <div className="mb-2">
                    <label className="flex items-center gap-2 text-xs font-bold text-slate-600 dark:text-slate-300 cursor-pointer">
                      <input type="checkbox" checked={newDocSetting.useCustom} onChange={e => setNewDocSetting(s => ({ ...s, useCustom: e.target.checked }))} className="rounded" />
                      커스텀 크기 사용 (mm)
                    </label>
                  </div>

                  {newDocSetting.useCustom && (
                    <div className="grid grid-cols-2 gap-2 mb-4">
                      <div>
                        <label className="text-[10px] font-semibold text-slate-500 dark:text-slate-400 block mb-0.5">가로 (mm)</label>
                        <input type="number" min="10" value={newDocSetting.customW} onChange={e => setNewDocSetting(s => ({ ...s, customW: e.target.value }))} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded px-2 py-1.5 text-sm outline-none focus:border-indigo-500" />
                      </div>
                      <div>
                        <label className="text-[10px] font-semibold text-slate-500 dark:text-slate-400 block mb-0.5">세로 (mm)</label>
                        <input type="number" min="10" value={newDocSetting.customH} onChange={e => setNewDocSetting(s => ({ ...s, customH: e.target.value }))} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded px-2 py-1.5 text-sm outline-none focus:border-indigo-500" />
                      </div>
                    </div>
                  )}

                  <div className="text-[11px] text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-900 rounded-md px-3 py-2 mb-5">
                    미리보기: {preview.widthMM} × {preview.heightMM} mm ({preview.label})
                  </div>

                  <div className="flex gap-2">
                    <button onClick={() => setShowNewDocModal(false)} className="flex-1 py-2 rounded-md text-sm font-bold border border-slate-300 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700">취소</button>
                    <button onClick={handleCreateNewDoc} className="flex-1 py-2 rounded-md text-sm font-bold bg-indigo-600 text-white hover:bg-indigo-700">새 문서 만들기</button>
                  </div>
                </div>
              </div>
            );
          })()}
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
